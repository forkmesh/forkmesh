<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Analytics overview</title>
  <desc id="desc">An analytics overview with visitor, pageview, and session totals, a traffic trend chart, and top pages and referrers.</desc>
  <rect width="1200" height="675" rx="28" fill="#0b1020"/>
  <rect x="36" y="36" width="1128" height="603" rx="22" fill="#11182b" stroke="#2b3654"/>
  <g font-family="system-ui,sans-serif">
    <text x="76" y="94" fill="#f7f8ff" font-size="30" font-weight="700">Analytics</text>
    <text x="76" y="124" fill="#8c96b3" font-size="16">First-party product analytics. Nothing leaves this instance.</text>
    <g font-size="13" fill="#8c96b3">
      <rect x="76" y="146" width="96" height="30" rx="7" fill="#1b2440" stroke="#3987e5"/>
      <text x="92" y="166" fill="#f7f8ff" font-weight="600">Overview</text>
      <text x="196" y="166">Insights</text><text x="276" y="166">Events</text><text x="352" y="166">People</text>
      <text x="424" y="166">Replay</text><text x="492" y="166">Heatmaps</text><text x="578" y="166">Flags</text>
      <text x="636" y="166">Surveys</text><text x="712" y="166">Errors</text>
    </g>
    <g>
      <rect x="76" y="196" width="250" height="96" rx="12" fill="#161f36" stroke="#2b3654"/>
      <text x="96" y="224" fill="#8c96b3" font-size="14">Visitors</text>
      <text x="96" y="262" fill="#f7f8ff" font-size="32" font-weight="700">12.4K</text>
      <text x="96" y="282" fill="#3fb950" font-size="13">▲ 18.2% vs previous period</text>
      <rect x="342" y="196" width="250" height="96" rx="12" fill="#161f36" stroke="#2b3654"/>
      <text x="362" y="224" fill="#8c96b3" font-size="14">Pageviews</text>
      <text x="362" y="262" fill="#f7f8ff" font-size="32" font-weight="700">48.9K</text>
      <text x="362" y="282" fill="#3fb950" font-size="13">▲ 11.5% vs previous period</text>
      <rect x="608" y="196" width="250" height="96" rx="12" fill="#161f36" stroke="#2b3654"/>
      <text x="628" y="224" fill="#8c96b3" font-size="14">Sessions</text>
      <text x="628" y="262" fill="#f7f8ff" font-size="32" font-weight="700">17.1K</text>
      <text x="628" y="282" fill="#3fb950" font-size="13">▲ 9.8% vs previous period</text>
      <rect x="874" y="196" width="250" height="96" rx="12" fill="#161f36" stroke="#2b3654"/>
      <text x="894" y="224" fill="#8c96b3" font-size="14">Bounce rate</text>
      <text x="894" y="262" fill="#f7f8ff" font-size="32" font-weight="700">38.6%</text>
      <text x="894" y="282" fill="#3fb950" font-size="13">▼ 2.1% vs previous period</text>
    </g>
    <rect x="76" y="308" width="650" height="296" rx="12" fill="#161f36" stroke="#2b3654"/>
    <text x="96" y="338" fill="#f7f8ff" font-size="17" font-weight="600">Traffic</text>
    <g stroke="#2b3654" stroke-width="1">
      <line x1="116" x2="706" y1="380" y2="380"/><line x1="116" x2="706" y1="440" y2="440"/>
      <line x1="116" x2="706" y1="500" y2="500"/><line x1="116" x2="706" y1="560" y2="560" stroke="#4a5677"/>
    </g>
    <path d="M116,470 L160,452 L204,462 L248,430 L292,438 L336,410 L380,420 L424,392 L468,400 L512,376 L556,388 L600,360 L644,368 L688,346 L706,350 L706,560 L116,560Z" fill="#3987e5" fill-opacity=".14"/>
    <path d="M116,470 L160,452 L204,462 L248,430 L292,438 L336,410 L380,420 L424,392 L468,400 L512,376 L556,388 L600,360 L644,368 L688,346 L706,350" fill="none" stroke="#3987e5" stroke-width="3" stroke-linejoin="round"/>
    <path d="M116,512 L160,504 L204,508 L248,494 L292,498 L336,486 L380,490 L424,478 L468,482 L512,470 L556,476 L600,462 L644,466 L688,456 L706,458" fill="none" stroke="#d95926" stroke-width="3" stroke-linejoin="round"/>
    <g font-size="13" fill="#8c96b3">
      <rect x="116" y="578" width="12" height="3" fill="#3987e5"/><text x="134" y="584">Pageviews</text>
      <rect x="220" y="578" width="12" height="3" fill="#d95926"/><text x="238" y="584">Visitors</text>
    </g>
    <rect x="742" y="308" width="382" height="140" rx="12" fill="#161f36" stroke="#2b3654"/>
    <text x="762" y="338" fill="#f7f8ff" font-size="17" font-weight="600">Top pages</text>
    <g font-size="14" fill="#dfe4f5">
      <rect x="762" y="352" width="300" height="24" rx="4" fill="#3987e5" fill-opacity=".22"/><text x="772" y="369">/</text><text x="1104" y="369" text-anchor="end">14,210</text>
      <rect x="762" y="382" width="200" height="24" rx="4" fill="#3987e5" fill-opacity=".22"/><text x="772" y="399">/pricing</text><text x="1104" y="399" text-anchor="end">9,480</text>
      <rect x="762" y="412" width="120" height="24" rx="4" fill="#3987e5" fill-opacity=".22"/><text x="772" y="429">/docs/start</text><text x="1104" y="429" text-anchor="end">5,902</text>
    </g>
    <rect x="742" y="464" width="382" height="140" rx="12" fill="#161f36" stroke="#2b3654"/>
    <text x="762" y="494" fill="#f7f8ff" font-size="17" font-weight="600">Referrers</text>
    <g font-size="14" fill="#dfe4f5">
      <rect x="762" y="508" width="280" height="24" rx="4" fill="#199e70" fill-opacity=".25"/><text x="772" y="525">$direct</text><text x="1104" y="525" text-anchor="end">6,118</text>
      <rect x="762" y="538" width="170" height="24" rx="4" fill="#199e70" fill-opacity=".25"/><text x="772" y="555">news.ycombinator.com</text><text x="1104" y="555" text-anchor="end">3,742</text>
      <rect x="762" y="568" width="96" height="24" rx="4" fill="#199e70" fill-opacity=".25"/><text x="772" y="585">duckduckgo.com</text><text x="1104" y="585" text-anchor="end">2,015</text>
