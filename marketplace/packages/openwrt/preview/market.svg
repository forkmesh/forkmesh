<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenWrt router</title>
  <desc id="desc">The Router page with tabs for the network, Wi-Fi, devices and port forwards, a list of Wi-Fi networks and a bar with two changes waiting to be applied.</desc>
  <rect width="1200" height="720" fill="#f6f8fb"/>
  <rect x="42" y="38" width="1116" height="644" rx="18" fill="#ffffff" stroke="#d7dee9" stroke-width="2"/>
  <rect x="94" y="96" width="76" height="40" rx="8" fill="#235fdb"/>
  <circle cx="114" cy="116" r="5" fill="#fff"/>
  <circle cx="132" cy="116" r="5" fill="#fff"/>
  <circle cx="150" cy="116" r="5" fill="#fff"/>
  <path d="M106 96l-10-30M158 96l10-30" stroke="#235fdb" stroke-width="6" stroke-linecap="round"/>
  <text x="196" y="118" fill="#172033" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Router</text>
  <text x="196" y="154" fill="#62708a" font-family="system-ui, sans-serif" font-size="19">192.168.1.1 · root · OpenWrt 24.10 on a home router</text>
  <rect x="92" y="186" width="1016" height="54" rx="10" fill="#eef4ff"/>
  <text x="114" y="220" fill="#172033" font-family="system-ui, sans-serif" font-size="18">2 changes are waiting. They take effect when you apply them.</text>
  <rect x="980" y="196" width="108" height="34" rx="8" fill="#235fdb"/>
  <text x="1006" y="219" fill="#fff" font-family="system-ui, sans-serif" font-size="17" font-weight="650">Apply</text>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#62708a">
    <text x="94" y="282">Overview</text>
    <text x="196" y="282">Network</text>
    <text x="294" y="282" fill="#235fdb" font-weight="700">Wi-Fi</text>
    <text x="364" y="282">Devices</text>
    <text x="458" y="282">Port forwards</text>
    <text x="600" y="282">Services</text>
    <text x="700" y="282">Packages</text>
    <text x="808" y="282">System</text>
    <text x="896" y="282">All settings</text>
  </g>
  <rect x="290" y="292" width="54" height="3" fill="#235fdb"/>
  <g font-family="system-ui, sans-serif" font-size="16" font-weight="650" fill="#64748b">
    <text x="94" y="336">NAME</text>
    <text x="420" y="336">DETAILS</text>
    <text x="820" y="336">STATE</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="19" fill="#172033">
    <text x="94" y="382" font-weight="650">radio0</text>
    <text x="420" y="382">2.4 GHz · channel 6</text>
    <text x="820" y="382">On</text>
    <text x="124" y="428">Home</text>
    <text x="420" y="428">WPA2/WPA3 (recommended) · lan</text>
    <text x="820" y="428">On</text>
    <text x="94" y="474" font-weight="650">radio1</text>
    <text x="420" y="474">5 GHz · channel 36</text>
    <text x="820" y="474">On</text>
    <text x="124" y="520">Home-5G</text>
    <text x="420" y="520">WPA3 only · lan</text>
    <text x="820" y="520">On</text>
    <text x="124" y="566">Guests</text>
    <text x="420" y="566">WPA2 · guest</text>
    <text x="820" y="566">Off</text>
  </g>
  <g stroke="#e5e9f0" stroke-width="2">
    <path d="M92 400h1016M92 446h1016M92 492h1016M92 538h1016"/>
  </g>
  <text x="94" y="630" fill="#62708a" font-family="system-ui, sans-serif" font-size="17">Every change waits until you apply it, and the router undoes it by itself if it stops answering.</text>
</svg>
