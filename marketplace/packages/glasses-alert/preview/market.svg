    <circle cx="92" cy="308" r="7" fill="#4f8cff"/>
    <text x="114" y="316">Loud alarm, even with the phone on silent</text>
    <circle cx="92" cy="364" r="7" fill="#4f8cff"/>
    <text x="114" y="372">Strong vibration you can feel in a pocket</text>
    <circle cx="92" cy="420" r="7" fill="#4f8cff"/>
