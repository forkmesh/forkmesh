<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">Glasses Alert on a phone, watching for smart glasses, with Ray-Ban Meta glasses found close by and the alarm ringing</title>
  <rect width="1280" height="720" fill="#0f1115"/>
  <rect x="32" y="32" width="1216" height="656" rx="16" fill="#171a21" stroke="#2a2f3a"/>
  <text x="80" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f4f5f7">Glasses Alert</text>
  <text x="80" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#a9b0bd">Know when Meta smart glasses are near you.</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#d8dce3">
    <circle cx="92" cy="252" r="7" fill="#4f8cff"/>
