          <section data-view="people" class="view active h-full overflow-y-auto people-page">
            <style>
              .people-page { --pp-night: #120d14; --pp-hearth: #3d1c0d; --pp-blazing: #ff6b2b; --pp-glowing: #ffa43a; --pp-kindling: #f4cf6b; --pp-warm: #5fc28e; --pp-embers: #7ea6c4; }
              .people-layout { display: grid; gap: 1.25rem; }
              @media (min-width: 1100px) { .people-layout { grid-template-columns: minmax(0, 30rem) minmax(0, 1fr); align-items: start; } .people-fire-col { position: sticky; top: 0; } }
              .people-fire { position: relative; aspect-ratio: 1; width: 100%; max-width: 30rem; margin: 0 auto; border-radius: 1.5rem; overflow: hidden; background: radial-gradient(circle at 50% 50%, var(--pp-hearth) 0%, #1f1214 40%, var(--pp-night) 75%); box-shadow: 0 20px 50px rgb(0 0 0 / .35); }
              .people-fire svg { display: block; width: 100%; height: 100%; }
              .people-fire .pp-band { fill: none; transition: opacity .2s, stroke-width .2s; }
              .people-fire .pp-seat { cursor: pointer; transition: opacity .2s, transform .15s; transform-box: fill-box; transform-origin: center; }
              .people-fire .pp-seat:hover, .people-fire .pp-seat:focus-visible { transform: scale(1.18); outline: none; }
              .people-fire .pp-seat:focus-visible .pp-ring { stroke-width: 4; }
              .people-fire .pp-label { cursor: pointer; }
              .people-fire [data-dim="1"] { opacity: .22; }
              .pp-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: pp-flicker 1.4s ease-in-out infinite alternate; }
              .pp-flame-core { animation-duration: .9s; }
              .pp-glow { animation: pp-pulse 2.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
              @keyframes pp-flicker { 0% { transform: scale(1, 1); } 35% { transform: scale(.96, 1.06); } 70% { transform: scale(1.04, .95); } 100% { transform: scale(.98, 1.08); } }
              @keyframes pp-pulse { from { opacity: .65; transform: scale(1); } to { opacity: 1; transform: scale(1.08); } }
              @media (prefers-reduced-motion: reduce) { .pp-flame, .pp-glow { animation: none; } }
              .pp-chip { display: inline-flex; align-items: center; gap: .4rem; min-height: 2.25rem; padding: 0 .8rem; border-radius: 999px; border: 1px solid rgb(var(--dashboard-border-rgb)); background: rgb(var(--dashboard-card-rgb)); font-size: .8rem; font-weight: 600; color: rgb(var(--dashboard-foreground-rgb)); cursor: pointer; }
              .pp-chip[aria-pressed="true"] { background: var(--pp-color); border-color: var(--pp-color); color: var(--pp-night); }
              .pp-chip .pp-dot { width: .65rem; height: .65rem; border-radius: 999px; background: var(--pp-color); }
              .pp-chip[aria-pressed="true"] .pp-dot { background: var(--pp-night); }
              .pp-chip .pp-count { font-weight: 400; opacity: .75; font-variant-numeric: tabular-nums; }
              .pp-section { position: relative; border: 1px solid rgb(var(--dashboard-border-rgb)); border-radius: .9rem; background: rgb(var(--dashboard-card-rgb)); overflow: hidden; }
              .pp-section::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--pp-color); }
              .pp-section-head { display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem .85rem 1.25rem; border-bottom: 1px solid rgb(var(--dashboard-border-rgb)); background: linear-gradient(90deg, color-mix(in srgb, var(--pp-color) 14%, transparent), transparent 60%); }
              .pp-badge { flex: none; display: grid; place-items: center; width: 2.1rem; height: 2.1rem; border-radius: 999px; background: color-mix(in srgb, var(--pp-color) 22%, transparent); color: var(--pp-color); }
              .pp-section-count { margin-left: auto; padding: .1rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600; color: var(--pp-color); background: color-mix(in srgb, var(--pp-color) 16%, transparent); font-variant-numeric: tabular-nums; }
              .pp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: .25rem; padding: .5rem .5rem .5rem .75rem; }
              .pp-person { display: flex; align-items: center; gap: .65rem; width: 100%; min-height: 3.25rem; padding: .4rem .5rem; border: 0; border-radius: .6rem; background: transparent; color: inherit; text-align: left; cursor: pointer; }
              .pp-person:hover, .pp-person:focus-visible { background: rgb(var(--dashboard-secondary-rgb)); outline: none; }
              .pp-avatar { flex: none; display: grid; place-items: center; width: 2.4rem; height: 2.4rem; border-radius: 999px; overflow: hidden; color: #fff; font-weight: 700; font-size: .95rem; box-shadow: 0 0 0 2px var(--pp-color); }
              .pp-avatar img { width: 100%; height: 100%; object-fit: cover; }
              .pp-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .875rem; font-weight: 600; }
              .pp-sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .75rem; color: rgb(var(--dashboard-muted-foreground-rgb)); }
              .pp-you { display: inline-flex; align-items: center; height: 18px; margin-left: .35rem; padding: 0 6px; border: 1px solid rgb(var(--dashboard-border-rgb)); border-radius: 999px; font-size: 11px; font-weight: 500; color: rgb(var(--dashboard-muted-foreground-rgb)); vertical-align: 1px; }
              dialog.pp-dialog { width: min(28rem, calc(100vw - 2rem)); padding: 0; border: 1px solid rgb(var(--dashboard-border-rgb)); border-radius: 12px; background: rgb(var(--dashboard-card-rgb)); color: rgb(var(--dashboard-foreground-rgb)); box-shadow: 0 16px 48px rgb(1 4 9 / .5); overflow: hidden; }
              dialog.pp-dialog::backdrop { background: rgb(1 4 9 / .6); }
              .pp-hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: .5rem; padding: 2rem 1rem 1.25rem; border-bottom: 1px solid rgb(var(--dashboard-border-rgb)); background: color-mix(in srgb, var(--pp-color) 10%, rgb(var(--dashboard-card-rgb))); color: rgb(var(--dashboard-foreground-rgb)); }
              .pp-hero .pp-avatar { width: 5.5rem; height: 5.5rem; font-size: 2.2rem; box-shadow: 0 0 0 3px var(--pp-color); }
              .pp-ring-badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid var(--pp-color); border-radius: 999px; color: rgb(var(--dashboard-foreground-rgb)); font-size: 12px; font-weight: 500; }
              .pp-ring-badge svg { color: var(--pp-color); }
              .pp-close { position: absolute; top: .5rem; right: .5rem; display: grid; place-items: center; width: var(--dashboard-control-height-sm); height: var(--dashboard-control-height-sm); border: 0; border-radius: var(--dashboard-control-radius); background: transparent; color: rgb(var(--dashboard-muted-foreground-rgb)); cursor: pointer; }
              .pp-close:hover { background: rgb(var(--dashboard-foreground-rgb) / .08); color: rgb(var(--dashboard-foreground-rgb)); }
              .pp-stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid rgb(var(--dashboard-border-rgb)); border-radius: .8rem; background: rgb(var(--dashboard-card-rgb)); }
              .pp-stats > div { padding: .7rem .25rem; text-align: center; }
              .pp-stats > div + div { border-left: 1px solid rgb(var(--dashboard-border-rgb)); }
              .pp-stats strong { display: block; font-size: 1.05rem; font-variant-numeric: tabular-nums; }
              .pp-stats span { font-size: .75rem; color: rgb(var(--dashboard-muted-foreground-rgb)); }
              .pp-btn { display: inline-flex; flex: 1; align-items: center; justify-content: center; gap: 6px; min-height: var(--dashboard-control-height); padding: 0 12px; border-radius: var(--dashboard-control-radius); font-size: var(--dashboard-control-font); font-weight: 500; cursor: pointer; text-decoration: none; }
              .pp-btn-primary { border: 1px solid rgb(var(--dashboard-foreground-rgb) / .1); background: rgb(var(--dashboard-cta-rgb)); color: rgb(var(--dashboard-cta-foreground-rgb)); }
              .pp-btn-primary:hover { background: rgb(var(--dashboard-cta-rgb) / .9); }
              .pp-btn-outline { border: 1px solid rgb(var(--dashboard-border-rgb)); background: rgb(var(--dashboard-secondary-rgb)); color: rgb(var(--dashboard-foreground-rgb)); }
              .pp-btn-outline:hover { background: rgb(var(--dashboard-foreground-rgb) / .08); }
              .pp-btn-outline svg { color: rgb(var(--dashboard-muted-foreground-rgb)); }
              .pp-btn:disabled { opacity: .55; cursor: default; }
            </style>
            <div class="w-full p-3 sm:p-6" data-people-app>
              <div class="mb-4 flex flex-wrap items-end justify-between gap-3">
                <div>
                  <h1 class="text-lg font-semibold text-foreground">People</h1>
                  <p class="mt-1 text-sm text-muted-foreground">Everyone around the fire. The most active sit closest to the flames; quieter members sit on the outer rings. Pick someone to see their profile, follow them or send a message.</p>
                </div>
                <label class="relative block w-full max-w-xs">
                  <span class="sr-only">Find a person</span>
                  <input data-people-query type="search" placeholder="Find a person" autocomplete="off" class="w-full rounded-md border border-border bg-background px-3 py-2 text-sm text-foreground">
                </label>
              </div>
              <div data-people-error role="alert" class="fm-flash fm-flash-danger mb-3 hidden"><i data-lucide="circle-alert"></i><p data-people-error-text class="fm-flash-body"></p></div>
              <div data-people-loading class="fm-blankslate rounded-lg border border-border bg-card"><span class="fm-spinner" aria-hidden="true"></span><p class="fm-blankslate-desc">Gathering everyone around the fire…</p></div>
              <div data-people-body class="people-layout hidden">
                <div class="people-fire-col">
                  <div class="people-fire" data-people-fire></div>
                  <div class="mt-3 flex flex-wrap justify-center gap-2" data-people-legend role="toolbar" aria-label="Rings"></div>
                </div>
                <div class="flex flex-col gap-4" data-people-sections></div>
              </div>
            </div>
            <dialog class="pp-dialog" data-people-dialog aria-labelledby="pp-dialog-name">
              <div data-people-dialog-body></div>
            </dialog>
          </section>
