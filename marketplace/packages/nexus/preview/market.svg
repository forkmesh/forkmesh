<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS</title>
  <desc id="desc">The NEXUS Scan section with a local network target and a table of open ports identified as SSH, HTTP and IPP.</desc>
  <rect width="1200" height="720" fill="#f6f8fb"/>
  <rect x="42" y="38" width="1116" height="644" rx="18" fill="#ffffff" stroke="#d7dee9" stroke-width="2"/>
  <g fill="none" stroke="#235fdb" stroke-width="7" stroke-linecap="round">
    <circle cx="132" cy="122" r="12" fill="#235fdb"/>
    <path d="M108 98a34 34 0 0 0 0 48M156 98a34 34 0 0 1 0 48"/>
    <path d="M92 82a56 56 0 0 0 0 80M172 82a56 56 0 0 1 0 80"/>
  </g>
  <text x="196" y="118" fill="#172033" font-family="system-ui, sans-serif" font-size="34" font-weight="700">NEXUS</text>
  <text x="196" y="154" fill="#62708a" font-family="system-ui, sans-serif" font-size="19">Discover, scan and inspect networks you own or are authorized to test</text>
  <g font-family="system-ui, sans-serif" font-size="16">
    <rect x="92" y="184" width="104" height="34" rx="8" fill="#eef2f8"/><text x="112" y="207" fill="#334155">Overview</text>
    <rect x="204" y="184" width="104" height="34" rx="8" fill="#eef2f8"/><text x="225" y="207" fill="#334155">Discover</text>
    <rect x="316" y="184" width="76" height="34" rx="8" fill="#235fdb"/><text x="335" y="207" fill="#ffffff" font-weight="650">Scan</text>
    <rect x="400" y="184" width="92" height="34" rx="8" fill="#eef2f8"/><text x="420" y="207" fill="#334155">Inspect</text>
    <rect x="500" y="184" width="92" height="34" rx="8" fill="#eef2f8"/><text x="520" y="207" fill="#334155">History</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="17">
    <text x="92" y="262" fill="#64748b">Target</text>
    <rect x="190" y="240" width="560" height="36" rx="7" fill="#ffffff" stroke="#c9d3e1"/><text x="204" y="264" fill="#172033">192.168.1.0/24</text>
    <text x="92" y="310" fill="#64748b">Ports</text>
    <rect x="190" y="288" width="560" height="36" rx="7" fill="#ffffff" stroke="#c9d3e1"/><text x="204" y="312" fill="#172033">Quick (20)</text>
    <rect x="780" y="264" width="150" height="44" rx="9" fill="#235fdb"/><text x="814" y="292" fill="#fff" font-weight="650">Start scan</text>
    <text x="92" y="360" fill="#62708a">Scan complete · 6 open of 5,080 checked.</text>
  </g>
  <text x="92" y="404" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="650">ADDRESS</text>
  <text x="300" y="404" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="650">PORT</text>
  <text x="400" y="404" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="650">STATE</text>
  <text x="520" y="404" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="650">SERVICE</text>
  <text x="760" y="404" fill="#64748b" font-family="system-ui, sans-serif" font-size="15" font-weight="650">DETAILS</text>
  <line x1="84" y1="418" x2="1116" y2="418" stroke="#d7dee9"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#334155">
    <text x="92" y="452">192.168.1.1</text><text x="300" y="452">22</text><text x="400" y="452">Open</text><text x="520" y="452">SSH</text><text x="760" y="452">SSH-2.0-dropbear_2022.83</text>
    <text x="92" y="494">192.168.1.1</text><text x="300" y="494">80</text><text x="400" y="494">Open</text><text x="520" y="494">HTTP</text><text x="760" y="494">HTTP/1.0 200 OK · uhttpd</text>
    <text x="92" y="536">192.168.1.20</text><text x="300" y="536">631</text><text x="400" y="536">Open</text><text x="520" y="536">IPP (inferred)</text><text x="760" y="536"></text>
    <text x="92" y="578">192.168.1.34</text><text x="300" y="578">8008</text><text x="400" y="578">Open</text><text x="520" y="578">HTTP / Google Cast</text><text x="760" y="578">HTTP/1.1 404 Not Found</text>
  </g>
  <text x="92" y="636" fill="#64748b" font-family="system-ui, sans-serif" font-size="16">Ordinary TCP connections only. Internet targets stay off until you allow them and confirm you may test them.</text>
</svg>
