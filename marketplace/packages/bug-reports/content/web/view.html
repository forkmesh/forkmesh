          <section data-view="bug-reports" class="view active h-full overflow-y-auto">
            <div class="mx-auto w-full max-w-3xl p-3 sm:p-6">
              <header class="mb-4 flex flex-wrap items-start justify-between gap-3">
                <div>
                  <h1 class="text-lg font-semibold text-foreground">Bugs</h1>
                  <p class="mt-1 text-sm text-muted-foreground">Report a bug privately to the ForkMesh administrators and follow what happens to it, from any device.</p>
                </div>
                <button data-bugs-refresh type="button" class="fm-btn fm-btn-sm"><i data-lucide="refresh-cw"></i>Refresh</button>
              </header>
              <div class="fm-segmented mb-4 inline-flex" role="group" aria-label="Bug report views">
                <button type="button" data-bugs-tab="report" aria-pressed="true">Report</button>
                <button type="button" data-bugs-tab="mine" aria-pressed="false">My reports</button>
                <button type="button" data-bugs-tab="reported" aria-pressed="false" class="hidden">Reported</button>
              </div>
              <div data-bugs-error role="alert" class="fm-flash fm-flash-danger mb-3 hidden"><i data-lucide="circle-alert"></i><p data-bugs-error-text class="fm-flash-body"></p></div>

              <form data-bugs-pane="report" data-bugs-form class="grid gap-3">
                <label class="text-xs text-muted-foreground">What happened, and what did you expect instead?
                  <textarea data-bugs-message required minlength="4" maxlength="4000" rows="6" class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-1.5 text-sm text-foreground"></textarea>
                </label>
                <div class="grid gap-3 sm:grid-cols-2">
                  <label class="text-xs text-muted-foreground">How bad is it?
                    <select data-bugs-severity class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-1.5 text-sm text-foreground">
                      <option value="low">Minor</option>
                      <option value="normal" selected>Normal</option>
                      <option value="high">Serious</option>
                      <option value="crash">Crash</option>
                    </select>
                  </label>
                  <label class="text-xs text-muted-foreground">Contact (optional)
                    <input data-bugs-contact type="text" maxlength="200" placeholder="Email or handle for a reply" class="mt-1 block w-full rounded-md border border-border bg-background px-2 py-1.5 text-sm text-foreground">
                  </label>
                </div>
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <p data-bugs-status role="status" class="min-h-4 text-xs text-muted-foreground"></p>
                  <button data-bugs-send type="submit" class="fm-btn fm-btn-sm"><i data-lucide="send"></i>Send report</button>
                </div>
              </form>

              <div data-bugs-pane="mine" class="hidden">
                <div data-bugs-mine class="overflow-hidden rounded-md border border-border bg-card"></div>
              </div>

              <div data-bugs-pane="reported" class="hidden">
                <label class="mb-3 inline-flex items-center gap-2 text-xs text-muted-foreground">Show
                  <select data-bugs-filter class="rounded-md border border-border bg-background px-2 py-1 text-sm text-foreground">
                    <option value="">All</option>
                    <option value="new" selected>New</option>
                    <option value="triaged">Triaged</option>
                    <option value="closed">Closed</option>
                  </select>
                </label>
                <div data-bugs-inbox class="overflow-hidden rounded-md border border-border bg-card"></div>
              </div>
            </div>
          </section>
