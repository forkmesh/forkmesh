<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <rect width="960" height="540" fill="#0d1117"/>
  <g font-family="sans-serif" fill="#c9d1d9">
    <text x="24" y="40" font-size="22" font-weight="bold">Backups</text>
    <text x="130" y="40" font-size="13" fill="#8b949e">Every backup ForkMesh keeps on this computer, sorted onto shelves</text>
    <text x="24" y="70" font-size="13" fill="#8b949e">Last snapshot 12 minutes ago. Hourly backups are on.</text>
    <rect x="24" y="84" width="14" height="14" rx="3" fill="#238636"/>
    <text x="46" y="96" font-size="13">Back up hourly</text>
    <rect x="160" y="82" width="120" height="20" rx="4" fill="#161b22" stroke="#30363d"/>
    <text x="170" y="96" font-size="12">24 in rotation</text>
    <rect x="816" y="80" width="120" height="26" rx="6" fill="#238636"/>
    <text x="836" y="98" font-size="13" fill="#ffffff">Back up now</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#c9d1d9">
    <rect x="24" y="120" width="200" height="380" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="36" y="146">All backups</text>
    <text x="36" y="164" fill="#8b949e" font-size="12">31 · 4.6 GB</text>
    <rect x="28" y="176" width="192" height="44" rx="4" fill="#1f6feb" opacity="0.35"/>
    <text x="36" y="196">Snapshots</text>
    <text x="36" y="212" fill="#8b949e" font-size="12">24 · 3.1 GB</text>
    <text x="36" y="244">Kept</text>
    <text x="36" y="260" fill="#8b949e" font-size="12">3 · 410 MB</text>
    <text x="36" y="292">Package data</text>
    <text x="36" y="308" fill="#8b949e" font-size="12">2 · 18 KB</text>
    <text x="36" y="340">Moved aside</text>
    <text x="36" y="356" fill="#8b949e" font-size="12">1 · 1.1 GB</text>
    <text x="36" y="388">Fleet database</text>
    <text x="36" y="404" fill="#8b949e" font-size="12">11 · 96 MB</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#c9d1d9">
    <text x="240" y="138" fill="#8b949e">Hourly and on-demand snapshots of this desktop's identity, account and settings.</text>
    <rect x="240" y="150" width="696" height="300" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="252" y="172" fill="#8b949e">Taken</text>
    <text x="392" y="172" fill="#8b949e">Age</text>
    <text x="492" y="172" fill="#8b949e">Size</text>
    <text x="562" y="172" fill="#8b949e">Label</text>
    <text x="702" y="172" fill="#8b949e">Notes</text>
    <rect x="244" y="184" width="688" height="24" fill="#1f6feb" opacity="0.35"/>
    <text x="252" y="200">27/09/2026 11:48</text><text x="392" y="200">12 minutes ago</text><text x="492" y="200">131 MB</text><text x="562" y="200">Before rekey</text>
    <text x="252" y="228">27/09/2026 10:48</text><text x="392" y="228">1 hour ago</text><text x="492" y="228">131 MB</text>
    <text x="252" y="256">27/09/2026 09:48</text><text x="392" y="256">2 hours ago</text><text x="492" y="256">130 MB</text><text x="562" y="256">After upgrade</text>
    <text x="252" y="284">26/09/2026 12:48</text><text x="392" y="284">23 hours ago</text><text x="492" y="284">129 MB</text><text x="702" y="284" fill="#d29922">Removed at the next backup</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#c9d1d9">
    <rect x="240" y="464" width="56" height="24" rx="5" fill="#21262d"/><text x="254" y="480">Keep</text>
    <rect x="302" y="464" width="62" height="24" rx="5" fill="#21262d"/><text x="314" y="480">Label…</text>
    <rect x="370" y="464" width="58" height="24" rx="5" fill="#21262d"/><text x="382" y="480">Verify</text>
    <rect x="434" y="464" width="72" height="24" rx="5" fill="#21262d"/><text x="446" y="480">Restore…</text>
    <rect x="512" y="464" width="74" height="24" rx="5" fill="#21262d"/><text x="524" y="480">Copy to…</text>
    <rect x="592" y="464" width="104" height="24" rx="5" fill="#21262d"/><text x="604" y="480">Show in folder</text>
    <rect x="862" y="464" width="74" height="24" rx="5" fill="#da3633"/><text x="874" y="480" fill="#ffffff">Delete…</text>
  </g>
</svg>
