  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(215 205)"><circle r="34" fill="#3f9b7a" stroke="#d4af37" stroke-width="3"/><text y="12" fill="#fff" font-size="32" font-weight="800">B</text><rect x="-52" y="38" width="104" height="40" rx="9" fill="#0a0a0a" stroke="#d4af37" stroke-opacity=".5"/><text y="55" fill="#e8e2cf" font-size="13">bob</text><text y="72" fill="#ffe08a" font-size="15" font-weight="800">3,625</text></g>
    <g transform="translate(985 205)"><circle r="34" fill="#8e5bb5" stroke="#d4af37" stroke-width="3"/><text y="12" fill="#fff" font-size="32" font-weight="800">R</text><rect x="-58" y="38" width="116" height="40" rx="9" fill="#0a0a0a" stroke="#d4af37" stroke-opacity=".5"/><text y="55" fill="#e8e2cf" font-size="13">River Rita</text><text y="72" fill="#ffe08a" font-size="15" font-weight="800">4,800</text></g>
    <g transform="translate(150 410)"><circle r="34" fill="#5d6e7a" stroke="#d4af37" stroke-width="3" opacity=".6"/><text y="12" fill="#fff" font-size="32" font-weight="800" opacity=".6">L</text><rect x="-52" y="38" width="104" height="40" rx="9" fill="#0a0a0a" stroke="#d4af37" stroke-opacity=".5"/><text y="55" fill="#e8e2cf" font-size="13">Lucky Lou</text><text y="72" fill="#ffe08a" font-size="15" font-weight="800">5,000</text><rect x="-24" y="-56" width="48" height="16" rx="8" fill="#546e7a"/><text y="-44" fill="#eceff1" font-size="10" font-weight="800">FOLD</text></g>
    <g transform="translate(1050 410)"><circle r="34" fill="#c58a2a" stroke="#d4af37" stroke-width="3"/><text y="12" fill="#fff" font-size="32" font-weight="800">C</text><rect x="-52" y="38" width="104" height="40" rx="9" fill="#0a0a0a" stroke="#d4af37" stroke-opacity=".5"/><text y="55" fill="#e8e2cf" font-size="13">carol</text><text y="72" fill="#ffe08a" font-size="15" font-weight="800">2,410</text><rect x="-38" y="-56" width="76" height="16" rx="8" fill="#1e88e5"/><text y="-44" fill="#fff" font-size="10" font-weight="800">CALL 250</text></g>
    <g transform="translate(600 516)" filter="url(#glow)"><circle r="38" fill="#c0504d" stroke="#ffe08a" stroke-width="4"/><text y="13" fill="#fff" font-size="34" font-weight="800">A</text></g>
    <g transform="translate(600 516)"><rect x="-60" y="42" width="120" height="40" rx="9" fill="#0a0a0a" stroke="#d4af37" stroke-opacity=".6"/><text y="59" fill="#e8e2cf" font-size="13">alice (you)</text><text y="76" fill="#ffe08a" font-size="15" font-weight="800">5,800</text></g>
  </g>
