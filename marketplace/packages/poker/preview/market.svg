    <rect x="-46" y="14" width="92" height="22" rx="11" fill="#000" fill-opacity=".45"/>
    <text x="0" y="30" text-anchor="middle" fill="#fff3c4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">Pot 1,250</text>
  </g>
  <g font-family="Georgia,serif" font-weight="700" filter="url(#shadow)">
    <g transform="translate(436 290)"><rect width="60" height="84" rx="7" fill="url(#card)"/><text x="8" y="22" fill="#c62828" font-size="18">A</text><text x="30" y="58" text-anchor="middle" fill="#c62828" font-size="34">♥</text></g>
    <g transform="translate(504 290)"><rect width="60" height="84" rx="7" fill="url(#card)"/><text x="8" y="22" fill="#c62828" font-size="18">K</text><text x="30" y="60" text-anchor="middle" fill="#c62828" font-size="28">K</text></g>
    <g transform="translate(572 290)"><rect width="60" height="84" rx="7" fill="url(#card)"/><text x="8" y="22" fill="#1a1a1a" font-size="18">7</text><text x="30" y="58" text-anchor="middle" fill="#1a1a1a" font-size="34">♣</text></g>
    <rect x="640" y="290" width="60" height="84" rx="7" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-dasharray="4 4"/>
