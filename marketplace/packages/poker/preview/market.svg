<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Poker table</title>
  <desc id="desc">A green felt poker table with six seats, the dealer at the top, three cards on the board, chip stacks in front of the players and the action bar with fold, call and raise.</desc>
  <defs>
    <radialGradient id="room" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1d2e25"/><stop offset=".6" stop-color="#0c1511"/><stop offset="1" stop-color="#040706"/></radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5229"/><stop offset=".3" stop-color="#5a3418"/><stop offset=".6" stop-color="#3b200d"/><stop offset=".8" stop-color="#6b3d1d"/><stop offset="1" stop-color="#2a170a"/></linearGradient>
    <radialGradient id="pad" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#2d2d2d"/><stop offset="1" stop-color="#0d0d0d"/></radialGradient>
    <radialGradient id="felt" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#14895a"/><stop offset=".45" stop-color="#0d5c3a"/><stop offset="1" stop-color="#073521"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ebe6d8"/></linearGradient>
    <pattern id="lattice" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#1e3a8a"/><path d="M0 0H9M0 0V9" stroke="#5574d6" stroke-width="1"/></pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#d4af37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#ffd740" flood-opacity=".9"/></filter>
    <g id="chip"><ellipse cx="0" cy="3" rx="17" ry="7" fill="#000" opacity=".45"/><ellipse cx="0" cy="0" rx="17" ry="7"/><ellipse cx="0" cy="-1" rx="11" ry="4" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 3"/></g>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#room)"/>
  <ellipse cx="600" cy="330" rx="470" ry="230" fill="url(#wood)" filter="url(#shadow)"/>
  <ellipse cx="600" cy="330" rx="452" ry="213" fill="url(#pad)"/>
  <ellipse cx="600" cy="330" rx="445" ry="206" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-dasharray="5 5"/>
  <ellipse cx="600" cy="330" rx="425" ry="190" fill="url(#felt)"/>
  <ellipse cx="600" cy="330" rx="395" ry="166" fill="none" stroke="#d4af37" stroke-opacity=".55" stroke-width="2"/>
  <text x="600" y="410" text-anchor="middle" fill="#ffffff" fill-opacity=".08" font-family="Georgia,serif" font-size="34" letter-spacing="12">FORKMESH</text>
  <g transform="translate(600 72)">
    <path d="M-38 70 C-36 46 -20 38 0 38 C20 38 36 46 38 70 Z" fill="#f7f7f2"/>
    <path d="M-38 70 C-36 48 -26 41 -12 40 L0 62 L12 40 C26 41 36 48 38 70 Z" fill="#141414"/>
    <path d="M0 45 L-8 40 L-8 50 Z M0 45 L8 40 L8 50 Z" fill="#c62828"/>
    <circle cx="0" cy="16" r="19" fill="#e9b892"/>
    <path d="M-19 14 C-19 -2 -8 -6 1 -6 C12 -6 19 2 18 14 C14 5 6 3 0 3 C-8 3 -15 7 -19 14 Z" fill="#3b2a1f"/>
    <circle cx="-7" cy="17" r="2" fill="#2b1d14"/><circle cx="7" cy="17" r="2" fill="#2b1d14"/>
    <path d="M-7 25 Q0 30 7 25" stroke="#7a4a33" stroke-width="2" fill="none" stroke-linecap="round"/>
    <rect x="-34" y="72" width="68" height="20" rx="10" fill="url(#gold)"/>
    <text x="0" y="87" text-anchor="middle" fill="#1a1306" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">DEALER</text>
  </g>
  <rect x="490" y="182" width="220" height="32" rx="12" fill="#000" fill-opacity=".42" stroke="#d4af37" stroke-opacity=".35"/>
  <text x="600" y="203" text-anchor="middle" fill="#fff7dc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Flop: A♥ K♦ 7♣</text>
  <g transform="translate(600 246)">
