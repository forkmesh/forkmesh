  <g transform="translate(886 252) rotate(7)"><rect width="38" height="54" rx="5" fill="url(#lattice)" stroke="#fff" stroke-width="3"/></g>
  <g transform="translate(930 380) rotate(-6)"><rect width="38" height="54" rx="5" fill="url(#lattice)" stroke="#fff" stroke-width="3"/></g>
  <g transform="translate(956 382) rotate(7)"><rect width="38" height="54" rx="5" fill="url(#lattice)" stroke="#fff" stroke-width="3"/></g>
  <g font-family="Georgia,serif" font-weight="700" filter="url(#shadow)">
    <g transform="translate(548 388) rotate(-6)"><rect width="62" height="88" rx="7" fill="url(#card)" stroke="#d4af37" stroke-width="3"/><text x="8" y="22" fill="#c62828" font-size="18">A</text><text x="31" y="60" text-anchor="middle" fill="#c62828" font-size="36">♦</text></g>
    <g transform="translate(596 390) rotate(7)"><rect width="62" height="88" rx="7" fill="url(#card)" stroke="#d4af37" stroke-width="3"/><text x="8" y="22" fill="#1a1a1a" font-size="18">A</text><text x="31" y="60" text-anchor="middle" fill="#1a1a1a" font-size="36">♠</text></g>
  </g>
  <g transform="translate(985 300)"><use href="#chip" fill="#2e7d32"/><use href="#chip" y="-6" fill="#212121"/></g>
  <g transform="translate(962 470)"><use href="#chip" fill="#212121"/><use href="#chip" y="-6" fill="#212121"/><use href="#chip" y="-12" fill="#c62828"/></g>
  <g transform="translate(452 486)"><circle r="17" fill="#f5f5f5" stroke="#b71c1c" stroke-width="2"/><text y="4" text-anchor="middle" fill="#111" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="900">DEALER</text></g>
  <rect x="0" y="617" width="1200" height="58" fill="#000" fill-opacity=".6"/>
  <text x="40" y="653" fill="#ffe08a" font-family="Georgia,serif" font-size="20">Three of a Kind, Aces</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" text-anchor="middle">
    <rect x="300" y="624" width="170" height="40" rx="10" fill="#546e7a"/><text x="385" y="650" fill="#fff">Fold</text>
    <rect x="484" y="624" width="190" height="40" rx="10" fill="#1e6fd0"/><text x="579" y="650" fill="#fff">Call 250</text>
    <rect x="688" y="624" width="230" height="40" rx="10" fill="url(#gold)"/><text x="803" y="650" fill="#1a1306">Raise to 1,000</text>
    <rect x="932" y="624" width="230" height="40" rx="10" fill="#c62828"/><text x="1047" y="650" fill="#fff">All in 5,800</text>
  </g>
