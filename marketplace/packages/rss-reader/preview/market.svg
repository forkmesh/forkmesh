    <circle cx="965" cy="656" r="10" fill="none" stroke="#9aa3b2" stroke-width="2"/><path d="M960 653l5 5 5-5" fill="none" stroke="#9aa3b2" stroke-width="2"/>
    <rect x="1150" y="646" width="15" height="20" rx="2" fill="none" stroke="#9aa3b2" stroke-width="2"/>
    <path d="M1200 662v-16M1194 652l6-6 6 6M1192 658v8h16v-8" fill="none" stroke="#9aa3b2" stroke-width="2"/>
