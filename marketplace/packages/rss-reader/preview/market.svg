    <text x="350" y="406" font-size="12" fill="#9aa3b2">subscriptions that follow you to every device.</text>
    <text x="350" y="424" font-size="11" fill="#6b7383">The ForkMesh Blog        Oct 13</text>
    <line x1="313" y1="434" x2="682" y2="434" stroke="#2a2f3a"/>
    <circle cx="334" cy="456" r="4.5" fill="#4493f8"/>
    <text x="350" y="461" font-size="14" font-weight="600" fill="#f4f5f7">Contributor spotlight: the docs team</text>
    <text x="350" y="482" font-size="12" fill="#9aa3b2">How a handful of volunteers rewrote the guides.</text>
    <text x="350" y="500" font-size="11" fill="#6b7383">Open Source Weekly        Oct 13</text>
    <line x1="313" y1="510" x2="682" y2="510" stroke="#2a2f3a"/>
    <circle cx="334" cy="532" r="4.5" fill="#4493f8"/>
    <text x="350" y="537" font-size="14" font-weight="600" fill="#f4f5f7">One-pan autumn vegetables</text>
    <text x="350" y="558" font-size="12" fill="#9aa3b2">Roast everything together and finish with herbs.</text>
    <text x="350" y="576" font-size="11" fill="#6b7383">Weekend Cooking        Oct 12</text>

    <text x="716" y="92" font-size="15" font-weight="600" fill="#58a6ff">Example Engineering</text>
    <text x="716" y="114" font-size="14" fill="#58a6ff">Dana Lee</text>
    <rect x="1168" y="72" width="48" height="48" rx="9" fill="#3d63dd"/><text x="1192" y="105" font-size="26" font-weight="700" text-anchor="middle" fill="#fff">E</text>
    <line x1="716" y1="136" x2="1216" y2="136" stroke="#2a2f3a"/>
    <text x="716" y="180" font-size="28" font-weight="700" fill="#f4f5f7">Faster builds with</text>
    <text x="716" y="214" font-size="28" font-weight="700" fill="#f4f5f7">incremental caching</text>
    <text x="716" y="244" font-size="13" font-weight="700" letter-spacing=".6" fill="#9aa3b2">OCT 14, 2026 AT 2:20 PM</text>
    <text x="716" y="288" font-size="16" fill="#d7dbe2">We cut our median build from nine minutes to two by</text>
    <text x="716" y="312" font-size="16" fill="#d7dbe2">caching every step that can be replayed safely. Here is</text>
    <text x="716" y="336" font-size="16" fill="#d7dbe2">how the cache keys work, what we refused to cache, and</text>
    <text x="716" y="360" font-size="16" fill="#d7dbe2">the one bug that taught us to hash the toolchain too.</text>
    <rect x="716" y="384" width="500" height="150" rx="8" fill="#1e222b"/>
    <path d="M760 500l70-62 50 40 40-28 76 50" fill="none" stroke="#4493f8" stroke-width="4" stroke-linejoin="round"/>
    <text x="716" y="566" font-size="16" fill="#d7dbe2">The short version: hash inputs, not timestamps.</text>
    <line x1="683" y1="628" x2="1247" y2="628" stroke="#2a2f3a"/>
    <circle cx="726" cy="656" r="9" fill="none" stroke="#9aa3b2" stroke-width="2"/>
