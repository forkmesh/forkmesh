<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">RSS Reader with smart feeds and folders on the left, an article timeline with unread dots and stars in the middle, and the selected article with its toolbar on the right</title>
