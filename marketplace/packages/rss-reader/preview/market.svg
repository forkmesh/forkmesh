    <rect x="328" y="116" width="338" height="30" rx="6" fill="#0f1115" stroke="#2a2f3a"/>
    <text x="352" y="136" font-size="13" fill="#6b7383">Search articles</text>
    <g>
      <rect x="313" y="158" width="369" height="92" fill="#1b2a40"/>
      <circle cx="334" cy="180" r="4.5" fill="#4493f8"/>
      <text x="350" y="185" font-size="14" font-weight="600" fill="#f4f5f7">Faster builds with incremental caching</text>
      <text x="350" y="206" font-size="12" fill="#9aa3b2">We cut our median build from nine minutes to two</text>
      <text x="350" y="222" font-size="12" fill="#9aa3b2">by caching every step that can be replayed safely.</text>
      <text x="350" y="240" font-size="11" fill="#6b7383">Example Engineering · Dana Lee        2:20 PM</text>
    </g>
    <line x1="313" y1="250" x2="682" y2="250" stroke="#2a2f3a"/>
    <circle cx="334" cy="272" r="4.5" fill="#4493f8"/>
    <text x="350" y="277" font-size="14" font-weight="600" fill="#f4f5f7">A new telescope maps the early universe</text>
    <text x="350" y="298" font-size="12" fill="#9aa3b2">The first images show galaxies forming far sooner</text>
    <text x="350" y="314" font-size="12" fill="#9aa3b2">than models predicted, astronomers said on Monday.</text>
    <text x="350" y="332" font-size="11" fill="#6b7383">Space &amp; Science Daily        1:05 PM</text>
