<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Survey</title>
    <meta name="description" content="A survey shared with ForkMesh." />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/survey/survey.css?v=${version}" />
    <script src="/survey/survey.js?v=${version}" defer></script>
  </head>
  <body>
    <main class="sv-wrap">
      <p class="sv-status" data-sv-status role="status">Loading the survey…</p>
      <form class="sv-sheet" data-sv-form novalidate hidden>
        <header class="sv-head">
          <p class="sv-kicker" data-sv-organization></p>
          <h1 class="sv-title" data-sv-title></h1>
          <p class="sv-muted sv-pre" data-sv-description></p>
          <p class="sv-muted sv-note" data-sv-required-note hidden>Questions marked * need an answer.</p>
        </header>
        <ol class="sv-questions" data-sv-questions></ol>
        <p class="sv-error" data-sv-error role="alert" hidden></p>
        <div class="sv-actions"><button type="submit" class="primary-button" data-sv-submit>Send answers</button></div>
      </form>
      <section class="sv-sheet sv-done" data-sv-done hidden>
        <h1 class="sv-title" data-sv-done-title>Thank you</h1>
        <p class="sv-pre" data-sv-thanks></p>
      </section>
      <p class="sv-credit" data-sv-credit>Made with <a href="https://forkmesh.com">ForkMesh</a></p>
    </main>
  </body>
</html>
