<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">The Spider Room page on an iPhone: the camera shows a living room, the Genie spider climbs the wall beside a window with a web next to it, and a speech bubble says Wall climbing</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a2e"/>
      <stop offset="1" stop-color="#2a2150"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9d2c4"/>
      <stop offset="1" stop-color="#bfb6a5"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4c"/>
      <stop offset="1" stop-color="#6b4f37"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fc6f0"/>
      <stop offset="1" stop-color="#d7ecfb"/>
    </linearGradient>
    <clipPath id="screen"><rect x="490" y="62" width="300" height="596" rx="34"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="96" y="250" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="46" font-weight="700">Spider Room</text>
  <text x="96" y="300" fill="#c9c3e8" font-family="-apple-system, Segoe UI, sans-serif" font-size="22">The Genie spider in your room.</text>
  <text x="96" y="336" fill="#c9c3e8" font-family="-apple-system, Segoe UI, sans-serif" font-size="22">Throw it, and it sticks where it lands.</text>
  <g font-family="-apple-system, Segoe UI, sans-serif" font-size="19" fill="#e9e6fb">
    <text x="886" y="250">Climbs walls and ceilings</text>
    <text x="886" y="290">Leaps onto tables and seats</text>
    <text x="886" y="330">Naps, knocks, peeks and dances</text>
    <text x="886" y="370">Spins webs on your walls</text>
  </g>
  <rect x="478" y="50" width="324" height="620" rx="44" fill="#0b0b12"/>
  <g clip-path="url(#screen)">
    <rect x="490" y="62" width="300" height="420" fill="url(#wall)"/>
    <polygon points="490,482 790,482 790,658 490,658" fill="url(#floor)"/>
    <line x1="490" y1="482" x2="790" y2="482" stroke="#a49a88" stroke-width="3"/>
    <rect x="640" y="160" width="118" height="150" rx="4" fill="url(#sky)" stroke="#f4f1ea" stroke-width="8"/>
    <line x1="699" y1="160" x2="699" y2="310" stroke="#f4f1ea" stroke-width="5"/>
    <line x1="640" y1="235" x2="758" y2="235" stroke="#f4f1ea" stroke-width="5"/>
    <rect x="520" y="430" width="150" height="16" rx="4" fill="#5b3f2b"/>
    <rect x="530" y="446" width="10" height="90" fill="#4a3322"/>
    <rect x="650" y="446" width="10" height="90" fill="#4a3322"/>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="1.4" fill="none">
      <line x1="560" y1="150" x2="600" y2="150"/>
      <line x1="560" y1="150" x2="520" y2="150"/>
      <line x1="560" y1="150" x2="560" y2="110"/>
      <line x1="560" y1="150" x2="560" y2="190"/>
      <line x1="560" y1="150" x2="588" y2="122"/>
      <line x1="560" y1="150" x2="532" y2="178"/>
      <line x1="560" y1="150" x2="588" y2="178"/>
      <line x1="560" y1="150" x2="532" y2="122"/>
      <circle cx="560" cy="150" r="12"/>
      <circle cx="560" cy="150" r="24"/>
      <circle cx="560" cy="150" r="36"/>
    </g>
    <g transform="translate(600 300)">
      <g stroke="#1a1a33" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M-14 -6 L-38 -26 L-50 -10"/>
        <path d="M-16 2 L-44 -6 L-58 10"/>
        <path d="M-16 10 L-42 14 L-52 32"/>
        <path d="M-12 16 L-32 30 L-36 48"/>
        <path d="M14 -6 L38 -26 L50 -10"/>
        <path d="M16 2 L44 -6 L58 10"/>
        <path d="M16 10 L42 14 L52 32"/>
        <path d="M12 16 L32 30 L36 48"/>
      </g>
      <circle r="24" fill="#1a1a33"/>
      <ellipse cy="-22" rx="18" ry="12" fill="#663da8"/>
      <rect x="-18" y="-17" width="36" height="5" rx="2.5" fill="#ccd1e0"/>
      <ellipse cx="4" cy="-36" rx="5" ry="10" fill="#8f66d1" transform="rotate(20 4 -36)"/>
      <circle cy="-20" r="4" fill="#40f2db"/>
      <circle cx="-8" cy="-2" r="6" fill="#f8f8ff"/>
      <circle cx="8" cy="-2" r="6" fill="#f8f8ff"/>
      <circle cx="-7" cy="-1" r="3" fill="#08080f"/>
      <circle cx="9" cy="-1" r="3" fill="#08080f"/>
      <path d="M-5 9 Q0 13 5 9" stroke="#361f61" stroke-width="2" fill="none"/>
    </g>
    <rect x="560" y="214" width="150" height="34" rx="16" fill="#ffffff" fill-opacity="0.95"/>
    <text x="635" y="236" text-anchor="middle" fill="#1f1a38" font-family="-apple-system, Segoe UI, sans-serif" font-size="15">Wall climbing!</text>
    <rect x="508" y="86" width="264" height="30" rx="15" fill="#000000" fill-opacity="0.55"/>
    <text x="640" y="106" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600">Found the floor, 2 walls and a table.</text>
    <rect x="548" y="596" width="184" height="40" rx="20" fill="#000000" fill-opacity="0.6"/>
    <text x="640" y="621" text-anchor="middle" fill="#ffffff" font-family="-apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">Call the spider</text>
  </g>
</svg>
