<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t">
  <title id="t">Password Vault listing saved logins with share badges, and a share dialog showing a recipient's key fingerprint</title>
  <rect width="1280" height="720" fill="#0f1115"/>
  <rect x="32" y="32" width="1216" height="656" rx="16" fill="#171a21" stroke="#2a2f3a"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-size="30" font-weight="600" fill="#f4f5f7">Password Vault</text>
    <text x="64" y="114" font-size="16" fill="#9aa3b2">Encrypted in your browser · shared under X25519 + ML-KEM-768 keys · ForkMesh stores only ciphertext</text>
    <rect x="64" y="146" width="560" height="44" rx="8" fill="#0f1115" stroke="#2a2f3a"/>
    <text x="82" y="174" font-size="15" fill="#6b7484">Search titles, usernames, and sites</text>
    <g transform="translate(64,210)">
      <rect width="560" height="420" rx="12" fill="#1e222b" stroke="#2a2f3a"/>
      <g transform="translate(24,26)">
        <text y="16" font-size="17" font-weight="600" fill="#f4f5f7">Domain registrar</text>
        <text y="40" font-size="14" fill="#9aa3b2">ops@acme.test · registrar.example</text>
        <rect y="54" width="74" height="20" rx="10" fill="none" stroke="#3987e5"/><text x="12" y="68" font-size="11" font-weight="600" fill="#3987e5">org acme</text>
        <rect x="386" y="6" width="58" height="28" rx="6" fill="#2a2f3a"/><text x="400" y="25" font-size="12" fill="#f4f5f7">User</text>
        <rect x="452" y="6" width="80" height="28" rx="6" fill="#2a2f3a"/><text x="464" y="25" font-size="12" fill="#f4f5f7">Password</text>
      </g>
      <line x1="0" y1="116" x2="560" y2="116" stroke="#2a2f3a"/>
      <g transform="translate(24,142)">
        <text y="16" font-size="17" font-weight="600" fill="#f4f5f7">Payment processor</text>
        <text y="40" font-size="14" fill="#9aa3b2">finance@acme.test · pay.example</text>
        <rect y="54" width="56" height="20" rx="10" fill="none" stroke="#3987e5"/><text x="12" y="68" font-size="11" font-weight="600" fill="#3987e5">dana</text>
        <rect x="386" y="6" width="58" height="28" rx="6" fill="#2a2f3a"/><text x="400" y="25" font-size="12" fill="#f4f5f7">User</text>
        <rect x="452" y="6" width="80" height="28" rx="6" fill="#2a2f3a"/><text x="464" y="25" font-size="12" fill="#f4f5f7">Password</text>
      </g>
      <line x1="0" y1="232" x2="560" y2="232" stroke="#2a2f3a"/>
      <g transform="translate(24,258)">
        <text y="16" font-size="17" font-weight="600" fill="#f4f5f7">Status page</text>
        <text y="40" font-size="14" fill="#9aa3b2">alerts@acme.test · status.example</text>
        <rect y="54" width="92" height="20" rx="10" fill="none" stroke="#6b7484"/><text x="12" y="68" font-size="11" font-weight="600" fill="#9aa3b2">from charlie</text>
        <rect x="100" y="54" width="70" height="20" rx="10" fill="none" stroke="#6b7484"/><text x="112" y="68" font-size="11" font-weight="600" fill="#9aa3b2">view only</text>
      </g>
    </g>
    <g transform="translate(664,146)">
      <rect width="552" height="484" rx="12" fill="#1e222b" stroke="#3987e5"/>
      <text x="28" y="44" font-size="20" font-weight="600" fill="#f4f5f7">Share Payment processor</text>
      <text x="28" y="70" font-size="13" fill="#9aa3b2">The login's key is sealed to each person's own public keys.</text>
      <rect x="28" y="92" width="496" height="92" rx="8" fill="#171a21" stroke="#2a2f3a"/>
      <text x="46" y="122" font-size="15" font-weight="600" fill="#f4f5f7">dana</text>
      <rect x="92" y="107" width="76" height="20" rx="10" fill="none" stroke="#6b7484"/><text x="104" y="121" font-size="11" font-weight="600" fill="#9aa3b2">first share</text>
      <text x="46" y="148" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9aa3b2">ace5 9791 c6fd 0829 8b2e 32af f7fc f141</text>
      <text x="46" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9aa3b2">f4d4 8505 7040 40e3 eb0e 71c6 a907 a3b0</text>
      <text x="28" y="216" font-size="13" fill="#9aa3b2">First share with this person. To be certain these keys are theirs,</text>
      <text x="28" y="236" font-size="13" fill="#9aa3b2">ask them to read their fingerprint to you.</text>
      <g transform="translate(28,272)">
        <rect width="496" height="150" rx="8" fill="#171a21" stroke="#2a2f3a"/>
        <text x="18" y="32" font-size="13" font-weight="600" fill="#f4f5f7">How a share is sealed</text>
        <text x="18" y="60" font-size="13" fill="#9aa3b2">Argon2id master password · AES-256-GCM items</text>
        <text x="18" y="84" font-size="13" fill="#9aa3b2">X25519 + ML-KEM-768 key exchange, X-Wing combiner</text>
        <text x="18" y="108" font-size="13" fill="#9aa3b2">Ed25519 signature from the sender on every share</text>
        <text x="18" y="132" font-size="13" fill="#9aa3b2">Key rotated when a share ends</text>
      </g>
      <rect x="440" y="436" width="84" height="32" rx="6" fill="#3987e5"/><text x="464" y="457" font-size="13" font-weight="600" fill="#ffffff">Share</text>
    </g>
  </g>
</svg>
