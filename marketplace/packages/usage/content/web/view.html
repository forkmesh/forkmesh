<section data-view="usage" class="view active h-full overflow-y-auto">
  <div class="mx-auto w-full max-w-5xl p-3 sm:p-6">
    <header class="mb-5 flex flex-wrap items-start justify-between gap-3">
      <div>
        <h1 class="text-lg font-semibold text-foreground">Model usage</h1>
        <p class="mt-1 text-sm text-muted-foreground">Current provider windows reported by desktops signed in to your account.</p>
      </div>
      <button data-usage-refresh type="button" class="fm-btn fm-btn-sm"><i data-lucide="refresh-cw"></i>Refresh</button>
    </header>
    <p data-usage-notice class="mb-4 text-sm text-muted-foreground" role="status"></p>
    <div data-usage-desktops class="overflow-hidden rounded-md border border-border bg-card">
      <div class="px-4 py-8 text-sm text-muted-foreground"><span class="fm-spinner"></span>Reading connected desktops…</div>
    </div>
  </div>
</section>
