  <text x="496" y="456" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" fill="#f4f5f7">14</text>
  <text x="602" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9aa3b2">seconds</text>
