  <rect x="468" y="146" width="436" height="510" rx="12" fill="#1e222b" stroke="#2a2f3a"/>
  <text x="496" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1" fill="#9aa3b2">STEP 4 OF 15 · DESK STRETCH</text>
  <text x="496" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#f4f5f7">Side stretch to the left</text>
  <text x="496" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#d6dae1">Reach your right arm up and over your head</text>
  <text x="496" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#d6dae1">and lean to the left. Feel the stretch all</text>
  <text x="496" y="310" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#d6dae1">along your right side.</text>
