    <text x="952" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2" text-decoration="line-through" opacity=".6">1. Stand tall</text>
  <text x="952" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2" text-decoration="line-through" opacity=".6">2. Hip circles</text>
  <text x="952" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2" text-decoration="line-through" opacity=".6">3. Arm swings</text>
  <text x="952" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f4f5f7">4. Side stretch to the left</text>
  <text x="952" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2">5. Side stretch to the right</text>
  <text x="952" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2">6. Twist to the left</text>
  <text x="952" y="394" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2">7. Twist to the right</text>
  <text x="952" y="446" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f4f5f7">Lymph tapping · 4.5 min</text>
