# Drop-in for a mirror node that runs Actions ("enableActions": true in
# mirror-node.json). Install as
#   /etc/systemd/system/forkmesh-mirror-node.service.d/actions.conf
# then: systemctl daemon-reload && systemctl restart forkmesh-mirror-node
#
# Workflow steps run inside a bubblewrap sandbox: no network, a cleared
# environment, a read-only /usr, and no view of /var/lib/forkmesh. bubblewrap
# builds that sandbox from unprivileged namespaces, which the base unit's
# RestrictNamespaces=true forbids outright. This replaces the blanket ban with
# the exact set bubblewrap's --unshare-all asks for. NoNewPrivileges and the
# empty CapabilityBoundingSet stay as they are, so the namespaces grant nothing
# outside themselves.
#
# Nodes that do not run Actions should not install this file. Without it the
# daemon logs "mirror actions are unavailable" and runs nothing: it never
# falls back to running a step unsandboxed.
[Service]
RestrictNamespaces=user mnt pid ipc uts net cgroup
