# ForkMesh mirror hosts: keys only. The fleet is reached with the shared
# ForkMesh key, so a password prompt only ever served the bots guessing at it
# ("pam_unix(sshd:auth): check pass; user unknown" in the host's journal).
#
# Installed as /etc/ssh/sshd_config.d/10-forkmesh-hardening.conf by
# tools/harden_mirror_sshd.sh, and by the desktop's Vultr install, which
# carries the same lines inline (MainWindowHostInstall.cpp) - change both. It
# sorts before cloud-init's 50-cloud-init.conf, and sshd keeps the first value
# it reads for an option.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:60
