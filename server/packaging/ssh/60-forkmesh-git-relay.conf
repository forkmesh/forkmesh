# ForkMesh SSH relay (www/docs/operations/git-ssh-gateway.md, "Relay mode").
# Installed as /etc/ssh/sshd_config.d/60-forkmesh-git-relay.conf by
# tools/install_ssh_relay.sh. It changes only the dedicated `git` account:
# root and every other account keep the server's own settings. The closing
# "Match all" ends this block, so nothing in it can apply to lines that
# sshd_config reads after its Include.
Match User git
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile none
    AuthorizedKeysCommand /opt/forkmesh-ssh/ssh-gateway-authorized-key authorized-key --key-type %t --key-blob %k
    AuthorizedKeysCommandUser forkmesh-ssh-lookup
    TrustedUserCAKeys none
    # Stock Git negotiates protocol v2 with this one variable; the gateway
    # accepts only version=1 or version=2.
    AcceptEnv GIT_PROTOCOL
    PermitTTY no
    DisableForwarding yes
    AllowTcpForwarding no
    AllowAgentForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    GatewayPorts no
    PermitUserRC no
    MaxSessions 2
    ClientAliveInterval 30
    ClientAliveCountMax 4

Match all
