d /run/forkmesh-mirror-refresh 0730 root git - -
# The direct-HTTPS gateway runs as forkmesh-mirror, not git, and must also be
# able to drop the coalescing marker after an accepted git-receive-pack
# (tools/mirror_gateway.py REFRESH_PENDING_PATH).  Grant write+traverse to that
# account only; the directory stays unreadable to it and to everyone else, so a
# marker can be created but the queue cannot be enumerated.  systemd-tmpfiles
# logs and continues when the account is absent on a read-only node.
a+ /run/forkmesh-mirror-refresh - - - - u:forkmesh-mirror:wx
