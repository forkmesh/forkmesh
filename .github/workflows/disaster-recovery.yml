name: Disaster recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-disaster-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drills:
    name: Runbook, kit, and live drills · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      # The dns-loss drill traces Git for DNS queries where strace exists.
      - name: Install the system call tracer
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends strace

      - name: Verify the runbook, kit, roster, rotations, drills, and exercise records
        run: >-
          python -m pytest -q -rs app/tests/test_disaster_recovery.py
          --junitxml=artifacts/disaster-recovery-${{ matrix.os }}.xml

      - name: Check the runbook, exercises, and rendered documents
        shell: bash
        run: python tools/forkmesh_disaster_recovery.py gate

      - name: Run every live drill and keep the reports
        shell: bash
        run: >-
          python tools/forkmesh_disaster_recovery.py drill run all
          --report artifacts/disaster-drills-${{ matrix.os }}.json
          --telemetry artifacts/disaster-drills-${{ matrix.os }}.jsonl

      - name: Report closure status
        if: always()
        shell: bash
        run: python tools/forkmesh_disaster_recovery.py closure || true

      - name: Retain drill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disaster-recovery-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/disaster-*
