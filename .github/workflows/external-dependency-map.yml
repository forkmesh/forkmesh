name: External dependency map

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-external-dependency-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory and failure drills · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Record the dependency inventory
        shell: bash
        run: python tools/external_dependency_inventory.py report --output artifacts/external-dependency-inventory.json

      - name: Verify the map, documentation, and privacy notice
        run: >-
          python -m pytest -q app/tests/test_external_dependency_map.py
          --junitxml=artifacts/external-dependency-map.xml

      - name: Retain dependency-map evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-dependency-map-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifacts/external-dependency-inventory.json
            artifacts/external-dependency-map.xml
          if-no-files-found: error
          retention-days: 30
