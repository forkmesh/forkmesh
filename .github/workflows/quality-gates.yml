name: ForkMesh quality gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Configure Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod

      - name: Install pinned test runner
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Validate gate definitions
        run: python3 tools/quality_gate.py validate

      - name: Reject silent performance-budget weakening
        if: github.event_name == 'pull_request'
        run: python3 tools/quality_gate.py compare --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Require completion evidence
        if: github.event_name == 'pull_request'
        run: python3 tools/quality_gate.py pr-evidence --event "$GITHUB_EVENT_PATH"

      - name: Run security, privacy, regression, and performance gates
        run: python3 tools/quality_gate.py run --profile core
