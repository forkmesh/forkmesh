name: Transport conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Adapters, leak tracing, and failover · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      # Leak tests trace the Git child process; without strace they skip, so
      # the Linux job installs it and the macOS job covers everything else.
      - name: Install the system call tracer
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends strace

      - name: Verify every adapter, the planner vectors, leak tests, failover, and recovery
        run: >-
          python -m pytest -q -rs app/tests/test_transports.py
          --junitxml=artifacts/transport-conformance-${{ matrix.os }}.xml

      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-conformance-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/transport-conformance-*.xml
