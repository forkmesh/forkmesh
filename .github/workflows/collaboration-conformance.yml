name: Collaboration conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Python and WebCrypto · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Configure Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Verify convergence, failure, migration, recovery, offline sync, and parity contracts
        run: >-
          python -m pytest -q app/tests/test_collaboration_protocol.py
          app/tests/test_export_collaboration_log.py
          app/tests/test_protocol_suite.py
          app/tests/test_protocol_certification.py
          app/tests/test_protocol_governance.py
          app/tests/test_public_interest_funding.py
          app/tests/test_social_signals.py
          app/tests/test_sync_status.py
          app/tests/test_trust_lists.py
          app/tests/test_offline_sync.py
          --junitxml=artifacts/collaboration-conformance.xml

      - name: Replay the compromised trust-list recovery drill
        shell: bash
        run: python tools/forkmesh_trust_lists.py drill > artifacts/trust-list-drill-${{ matrix.os }}.json

      - name: Verify protocol suite consistency and clean-room vectors
        shell: bash
        run: python conformance/protocol/v1/verify_suite.py > artifacts/protocol-suite-report.json

      - name: Certify in-repository implementations against their profiles
        shell: bash
        run: |
          python tools/protocol_certification.py validate
          python tools/protocol_certification.py render --check
          python tools/protocol_governance.py gate
          python tools/public_interest_funding.py gate
          python tools/protocol_certification.py run --profile core \
            --implementation forkmesh-clean-room-python \
            --output artifacts/protocol-certification-core-${{ matrix.os }}.json
          python tools/protocol_certification.py run --profile collaboration-fold \
            --implementation forkmesh-webcrypto-javascript \
            --output artifacts/protocol-certification-collaboration-fold-${{ matrix.os }}.json

      - name: Round-trip social signals between the Python and JavaScript implementations
        shell: bash
        run: python tools/social_signals.py gate > artifacts/social-signals-gate-${{ matrix.os }}.json

      - name: Retain conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: collaboration-conformance-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifacts/collaboration-conformance.xml
            artifacts/protocol-suite-report.json
            artifacts/protocol-certification-*.json
            artifacts/trust-list-drill-*.json
            artifacts/social-signals-gate-*.json
          if-no-files-found: error
          retention-days: 30
