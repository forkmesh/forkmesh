name: Stock Git conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-git-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  stock-git:
    name: Git protocol v${{ matrix.protocol }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        protocol: [0, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate the versioned contract and generated public matrix
        run: |
          python tools/git_conformance.py validate
          python tools/git_conformance.py render --check

      - name: Exercise unmodified stock Git through direct, relay, and failover fixtures
        run: >-
          python tools/git_conformance.py run
          --transport http
          --protocol-version ${{ matrix.protocol }}
          --client-label "system Git on ${{ matrix.os }}"
          --output artifacts/git-conformance-${{ matrix.os }}-v${{ matrix.protocol }}.json

      - name: Prove this run backs every published support claim
        run: >-
          python tools/git_conformance.py gate
          --operations-only
          --report artifacts/git-conformance-${{ matrix.os }}-v${{ matrix.protocol }}.json

      - name: Retain exact client, operation, failure, recovery, and telemetry evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-conformance-${{ matrix.os }}-v${{ matrix.protocol }}-${{ github.run_id }}
          path: artifacts/git-conformance-${{ matrix.os }}-v${{ matrix.protocol }}.json
          if-no-files-found: error
          retention-days: 30

  gateway-contracts:
    name: Production gateway failure and integrity contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Verify partial clone, hidden refs, denied HTTPS push, and hardened SSH receive-pack
        run: >-
          python -m pytest -q
          app/tests/test_git_http.py
          app/tests/test_git_workflow_conformance.py
          app/tests/test_mirror_gateway.py::test_raw_release_and_git_upload_pack_are_stream_specs
          app/tests/test_mirror_gateway.py::test_real_git_clone_cannot_advertise_or_fetch_internal_merge_objects
          app/tests/test_ssh_git_auth.py::test_gateway_runs_hardened_git_without_shell_after_authorization
          --junitxml=artifacts/git-gateway-contracts.xml

      - name: Retain production gateway evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: git-gateway-contracts-${{ github.run_id }}
          path: artifacts/git-gateway-contracts.xml
          if-no-files-found: error
          retention-days: 30
