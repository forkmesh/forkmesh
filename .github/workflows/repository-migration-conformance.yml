name: Repository migration conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-repository-migration-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  conformance:
    name: GitHub, GitLab, Codeberg · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Verify fidelity, reports, interruption, recovery, telemetry, and convergence
        run: >-
          python -m pytest -q
          app/tests/test_repository_migration.py
          app/tests/test_repository_migration_report.py
          app/tests/test_repository_imports.py
          app/tests/test_dashboard_bundle.py
          --junitxml=artifacts/repository-migration-conformance.xml

      - name: Retain migration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-migration-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/repository-migration-conformance.xml
          if-no-files-found: error
          retention-days: 30
