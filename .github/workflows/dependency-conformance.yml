name: Dependency workflow conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-dependency-conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  stock-clients:
    name: Git, pip, npm, Go, Cargo · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Configure Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Configure Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Validate the contract against the reference, documentation, and this workflow
        run: python tools/dependency_conformance.py validate

      - name: Verify identity, route selection, pin rules, and route spellings
        run: >-
          python -m pytest -q
          app/tests/test_dependency_workflows.py
          --junitxml=artifacts/dependency-contracts-${{ matrix.os }}.xml

      - name: Install through unmodified clients across provider switch, origin loss, tampering, and recovery
        run: >-
          python tools/dependency_conformance.py run
          --require git,git-submodule,pip,npm,go,cargo
          --client-label "runner clients on ${{ matrix.os }}"
          --output artifacts/dependency-conformance-${{ matrix.os }}.json

      - name: Retain versions, outcomes, lock digests, resolutions, and telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-conformance-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
