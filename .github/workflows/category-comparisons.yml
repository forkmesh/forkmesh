name: Category comparisons

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-category-comparisons-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  claims:
    name: Claim evidence and freshness · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Record claim freshness measures
        shell: bash
        run: python tools/category_comparisons.py report --output artifacts/category-comparisons.json

      - name: Verify claims, evidence, next steps, and the published page
        run: >-
          python -m pytest -q app/tests/test_category_comparisons.py
          --junitxml=artifacts/category-comparisons.xml

      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: category-comparisons-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifacts/category-comparisons.json
            artifacts/category-comparisons.xml
          if-no-files-found: error
          retention-days: 30
