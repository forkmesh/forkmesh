name: Category comparisons

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-category-comparisons-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  claims:
    name: Claim evidence and freshness · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Record claim freshness measures
        shell: bash
        run: python tools/category_comparisons.py report --output artifacts/category-comparisons.json

      - name: Verify claims, evidence, next steps, and the published page
        run: >-
          python -m pytest -q app/tests/test_category_comparisons.py
          --junitxml=artifacts/category-comparisons.xml

      - name: Retain comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: category-comparisons-${{ matrix.os }}-${{ github.run_id }}
          path: |
            artifacts/category-comparisons.json
            artifacts/category-comparisons.xml
          if-no-files-found: error
          retention-days: 30
