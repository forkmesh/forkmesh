name: Private surface confidentiality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forkmesh-private-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  keyless-inspection:
    name: Keyless inspection · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-ci.txt

      - name: Install pinned test runner
        run: python -m pip install --disable-pip-version-check -r tools/requirements-ci.txt

      - name: Verify storage, backup, index, replica, and failure contracts
        run: >-
          python -m pytest -q app/tests/test_private_surface_audit.py
          app/tests/test_private_repository_control_access.py
          app/tests/test_https_mirror_routing_integration.py
          app/tests/test_security_controls.py
          app/tests/test_sentry_worker.py
          -k "private or error_logs"
          --junitxml=artifacts/private-surface-confidentiality.xml

      - name: Retain confidentiality evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-surface-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/private-surface-confidentiality.xml
          if-no-files-found: error
          retention-days: 30
