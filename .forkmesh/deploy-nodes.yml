  workflow_dispatch:
runs-on: forkmesh
jobs:
  deploy:
    steps:
      - name: Deploy main to n1-n3 through the node deploy agent
        run: |
          python3 - <<'PY'
          import os
          import sys
          import time

          path = "/workspace/node-deploy.log"
          mark = "::node-deploy-result::"
          start = time.time()
          while not os.path.exists(path):
              if time.time() - start > 180:
                  print("The node deploy agent did not pick up this run within 3 minutes.")
                  print("On the source node: systemctl --user status forkmesh-node-deploy")
                  sys.exit(1)
              time.sleep(2)
          offset = 0
          pending = ""
          while time.time() - start < 85 * 60:
              with open(path, "rb") as handle:
                  handle.seek(offset)
                  chunk = handle.read()
              offset += len(chunk)
              lines = (pending + chunk.decode("utf-8", "replace")).split("\n")
              pending = lines.pop()
              for line in lines:
                  if line.startswith(mark):
                      verdict, _, message = line[len(mark):].strip().partition(" ")
                      print(("PASSED: " if verdict == "ok" else "FAILED: ") + message)
                      sys.exit(0 if verdict == "ok" else 1)
                  print(line, flush=True)
              time.sleep(1)
          print("Stopped following after 85 minutes; the agent keeps going.")
          print("Its log is under the fleet logs directory, autodeploy/.")
          sys.exit(1)
          PY
