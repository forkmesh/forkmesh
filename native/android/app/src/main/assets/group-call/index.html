<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss: https:; style-src 'unsafe-inline'; img-src data: blob:; media-src blob: mediastream:">
<style>
html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;padding:0 12px 12px;box-sizing:border-box}
.tile{position:relative;aspect-ratio:3/4;border-radius:10px;background:#1f1f1f;overflow:hidden}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.self video{transform:scaleX(-1)}
.tile.blank video{opacity:0}
.avatar{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--fm-accent,#0a84ff);display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.tile.blank .avatar{display:flex}
.name{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 24px);padding:2px 6px;border-radius:999px;background:rgba(0,0,0,.55);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;left:6px;bottom:32px;max-width:calc(100% - 28px);padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warning{position:absolute;left:6px;top:6px;max-width:calc(100% - 24px);padding:3px 6px;border-radius:6px;background:rgba(255,149,0,.85);font-size:11px;font-weight:600;line-height:1.25}
.tile.forged .warning{background:rgba(255,59,48,.85)}
.badge[hidden],.warning[hidden]{display:none}
</style>
</head>
<body>
<div id="grid" role="list"></div>
<script type="module" src="group-call-host.js"></script>
</body>
</html>
