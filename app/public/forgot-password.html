<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/api-client.js?v=${version}"></script>
    <script src="/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password · ForkMesh</title>
    <meta name="description" content="Request a password reset link for your ForkMesh account." />
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/forgot-password.js?v=${version}" defer></script>
    <!-- Cloudflare Turnstile (managed), rendered by forgot-password.js with
         the site key from /api/turnstile. The page CSP allows it. -->
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=forkmeshForgotChallengeReady"
      async
      defer
    ></script>
    <style>
      body {
        min-height: 100vh;
        color: #f5f5f5;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.16), transparent 30rem),
          #050505;
      }

      .auth-shell {
        position: relative;
        z-index: 1;
        min-height: calc(100vh - 3.5rem);
        display: grid;
        place-items: center;
        padding: 28px 16px;
      }

      /* Same card surface as login and signup: a solid panel lifted off the
         page, mark only, and controls on the shared 44/46px scale. */
      .auth-card {
        width: min(100%, 448px);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 16px;
        background: #18181b;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
        padding: 40px 36px 32px;
      }

      .brand {
        display: flex;
        width: fit-content;
        margin: 0 auto 20px;
      }

      .brand-mark { width: 2.5rem; height: 2.5rem; }

      .auth-card h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        text-align: center;
        margin: 0 0 8px;
        color: #ffffff;
      }

      .auth-sub {
        color: rgba(255, 255, 255, 0.62);
        text-align: center;
        margin: 0 0 28px;
        font-size: 15px;
      }

      .field { margin: 0 0 20px; }
      .field label {
        display: block;
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.88);
      }

      .field input {
        width: 100%;
        height: 2.75rem;
        padding: 0 0.875rem;
        border-radius: 0.625rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #101013;
        color: #f5f5f5;
        font: inherit;
        font-size: 15px;
      }

      .field input:focus {
        outline: 0;
        border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 2.875rem;
        border-radius: 0.625rem;
        border: 0;
        background: #f5f5f5;
        color: #050505;
        font-size: 15px;
        font-weight: 650;
        cursor: pointer;
        transition: transform 150ms ease, background-color 150ms ease, color 150ms ease;
      }

      .auth-button-primary:hover {
        background: #d9d9d9;
        color: #050505;
      }

      .auth-button-primary:active {
        transform: translateY(1px);
      }

      .auth-button-primary:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }

      .auth-button-primary:disabled {
        background: #e6e6e6;
        color: #050505;
        cursor: not-allowed;
      }
      .hint { font-size: 13px; color: rgba(255, 255, 255, 0.62); margin: 4px 0 18px; min-height: 18px; }
      .hint.bad { color: var(--danger); }
      .hint.good { color: rgba(255, 255, 255, 0.82); }
      .row-links { text-align: center; margin-top: 18px; color: rgba(255, 255, 255, 0.58); font-size: 14px; }
      .row-links a { color: #ffffff; }
    </style>
    <link rel="stylesheet" href="/auth-page-theme.css" />
    <link rel="stylesheet" href="/auth-mesh.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <script src="/auth-mesh.js?v=${version}" defer></script>
    <script src="/site-header.js?v=${version}" defer></script>
    <script src="/genie-spider.js?v=${version}" defer></script>
  </head>
  <body data-fm-auth>
    <div data-forkmesh-auth-mesh></div>
    <div data-forkmesh-header="simple"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="forgot-title">
        <a class="brand" href="/" aria-label="ForkMesh home">
          <img class="brand-mark" src="/assets/logo.svg" alt="" aria-hidden="true" />
        </a>

      <h1 id="forgot-title">Reset your password</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link.</p>
      <div class="field">
        <label for="identifier">Email</label>
        <input class="auth-input-sm" id="identifier" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" />
      </div>
      <div id="forgot-turnstile" style="display:flex;justify-content:center;min-height:65px;margin:0 0 14px"></div>
      <div class="hint" id="forgot-hint"></div>
      <button class="auth-button-primary btn-primary" id="forgot-btn">Send reset link</button>
      <p class="row-links">Remembered it? <a href="/login">Back to log in</a></p>
      </section>
    </main>
  </body>
</html>
