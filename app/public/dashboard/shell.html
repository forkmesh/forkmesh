    <script>
      (() => {
        const key = "forkmesh.dashboard.theme";
        const siteKey = "forkmesh.theme";
        let theme = "dark";
        try {
          const hint = new URLSearchParams(location.search).get("theme");
          const cookie = document.cookie.split(";").map((part) => part.trim()).find((part) => part.startsWith("forkmesh_theme="))?.slice(15);
          const stored = localStorage.getItem(key) || localStorage.getItem(siteKey);
          const preferred = hint === "light" || hint === "dark" ? hint : (stored || cookie);
          theme = preferred === "light" ? "light" : "dark";
          if (hint === "light" || hint === "dark") {
            localStorage.setItem(key, theme);
            localStorage.setItem(siteKey, theme);
          }
        } catch (_) {}
        document.documentElement.dataset.dashboardTheme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "light" ? "#f6f8fb" : "#090909");
      })();
      // Every dashboard page starts from the repository catalog; ask for it
      // with the HTML instead of after dashboard.js has run (02-helpers.js
      // takeEarlyPublicRead). The repository page's early reads already did.
      if (!window.__forkmeshEarly) {
        try {
          window.__forkmeshEarly = {
            at: Date.now(), base: "", reads: {}, local: false,
            catalog: fetch("/api/repositories", { credentials: "omit", headers: { accept: "application/json" } })
              .then((response) => (response.ok ? response.json() : null)).catch(() => null),
          };
        } catch (_) {}
      }
      // Who is signed in is asked now, in parallel with dashboard.js, instead
      // of after it has run: bootDashboard waited for this round trip before
      // it rendered anything. 02-helpers.js (restoreControllerSession,
      // hydratePortableMirrorSession) takes the answer over.
      (() => {
        try {
          const host = location.hostname.toLowerCase();
          if (["app.forkmesh.com", "forkmesh.com", "world.forkmesh.com"].includes(host)) {
            const stored = JSON.parse(localStorage.getItem("forkmesh.session") || "null");
            if (!stored?.nodeName && window.ForkMeshAPI?.restoreSession) {
              window.__forkmeshSessionCheck = { kind: "controller", pending: window.ForkMeshAPI.restoreSession() };
            }
          } else {
            window.__forkmeshSessionCheck = {
              kind: "mirror",
              pending: fetch("/api/accounts/sessions", { method: "GET", credentials: "same-origin", cache: "no-store", headers: { Accept: "application/json" } })
                .then(async (response) => ({ ok: response.ok, status: response.status, payload: response.ok ? await response.json().catch(() => null) : null }))
                .catch(() => null),
            };
          }
        } catch (_) {}
      })();
    </script>

      /* Repository pages follow GitHub: the header and the tab strip sit on the
         chrome colour, everything under the tabs on the lighter canvas.
         Redefining the background token inside the content grid moves every
         bg-background box there with it, so no panel paints a darker hole. */
      [data-view="explore"]:has([data-repo-layout]) {
        background: rgb(var(--dashboard-canvas-rgb));
      }
      [data-repo-github-header] {
        background: rgb(var(--dashboard-header-rgb));
      }
      [data-repo-content-grid] {
        --dashboard-background-rgb: var(--dashboard-canvas-rgb);
        --background: rgb(var(--dashboard-canvas-rgb));
      }

      /* Repository tabs: the selected one carries GitHub's coral underline.
         Driven by aria-selected so setRepoTab only has to flip one attribute. */
      [data-repo-github-header] [data-dashboard-repo-tab][role="tab"][aria-selected="true"] {
        font-weight: 600;
      }
      [data-repo-github-header] [data-dashboard-repo-tab][role="tab"][aria-selected="true"]::after {
        content: "";
        position: absolute;
        left: 8px;
        right: 8px;
        /* The strip scrolls sideways on narrow screens, which clips anything
           hanging below it, so the underline sits on the strip's last pixels. */
        bottom: 0;
        height: 2px;
        border-radius: 6px;
        background: var(--dashboard-tab-underline);
      }

      /* Issues page: views sidebar beside the list on wide screens. The
         sidebar can be collapsed, and it steps aside while an issue is open. */
      @media (min-width: 1024px) {
        [data-repo-issues-layout] {
          grid-template-columns: 13.5rem minmax(0, 1fr);
        }
        [data-repo-issues-layout][data-views-collapsed="true"] {
          grid-template-columns: minmax(0, 1fr);
        }
        [data-repo-issues-layout][data-views-collapsed="true"] > [data-repo-issue-views] {
          display: none;
        }
        [data-repo-issues-layout][data-views-collapsed="true"] [data-repo-issue-views-toggle] {
          display: inline-flex;
        }
      }
      [data-repo-issues-layout][data-record-open="true"] {
        grid-template-columns: minmax(0, 1fr) !important;
      }
      [data-repo-issues-layout][data-record-open="true"] [data-repo-collection-chrome] {
        display: none !important;
      }
      [data-repo-issues-layout][data-record-open="true"] [data-repo-collection-box] {
        overflow: visible;
        border: 0;
        border-radius: 0;
        background: transparent;
      }
      [data-repo-issue-views] [aria-current="true"]::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 6px;
        bottom: 6px;
        width: 4px;
        border-radius: 6px;
        background: #1f6feb;
      }
      [data-repo-issue-views] [data-repo-issue-views-toggle] {
        display: flex;
      }

      /* The issue timeline rail: one line through the event badges, hidden
         behind the comment cards, which paint their own background. */
      [data-repo-issue-timeline][data-empty="false"] {
        position: relative;
      }
      [data-repo-issue-timeline][data-empty="false"]::before {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 15px;
        width: 2px;
        background: rgb(var(--dashboard-border-rgb));
      }
      /* Positioned, so the cards paint over the absolutely placed rail. */
      [data-repo-issue-timeline] > [data-repo-issue-comment] > * {
        position: relative;
      }
      @media (min-width: 640px) {
        [data-repo-issue-timeline][data-empty="false"]::before {
          left: 71px;
        }
      }

      /* Issue labels: a pill tinted from the label's hashed hue
         (issueLabelHue), readable on both the dark canvas and white. */
      .issue-label {
        display: inline-block;
        border: 1px solid hsl(var(--label-h) 70% 55% / 0.5);
        border-radius: 2em;
        background: hsl(var(--label-h) 75% 50% / 0.18);
        color: hsl(var(--label-h) 80% 74%);
        padding: 0 7px;
        font-size: 12px;
        font-weight: 500;
        line-height: 18px;
        white-space: nowrap;
      }
      [data-dashboard-theme="light"] .issue-label {
        border-color: hsl(var(--label-h) 60% 40% / 0.4);
        background: hsl(var(--label-h) 75% 45% / 0.12);
        color: hsl(var(--label-h) 75% 28%);

      /* Edit / delete controls on your own chat messages. Hidden until the row
         is hovered (or a control takes keyboard focus) so the transcript stays
         quiet, like the full chat page. Hand-written because the pre-built
         dashboard/tailwind.css carries no group-hover variant. */
      .chat-message-actions {
        opacity: 0;
        transition: opacity 120ms ease;
      }

      [data-dashboard-chat-context-rail],
      [data-dashboard-chat-scroll-rail],
      [data-dashboard-chat-emotes] {
        display: none;
      }

      .group:hover > .chat-message-actions,
      .chat-message-actions:focus-within {
        opacity: 1;
      }

      /* Touch devices never hover: keep the controls reachable there. */
      @media (hover: none) {
        .chat-message-actions {
          opacity: 1;
        }
      }

      .chat-reactions {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
      }

      .chat-reactions:empty {
        display: none;
      }

      .chat-reaction-chip,
      .chat-reaction-picker button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        border: 1px solid rgb(var(--dashboard-border-rgb));

        color: var(--foreground);

      .chat-reaction-chip {

        padding: 1px 8px;

      .chat-reaction-chip.is-mine {

      .chat-mention-card {

        background: rgb(var(--dashboard-popover-rgb));

        color: rgb(var(--dashboard-popover-foreground-rgb));

        text-decoration: none;

      .chat-mention-card[hidden] {
        display: none;
      }

      .chat-mention-card strong {
        font-size: 13px;
        color: rgb(var(--dashboard-popover-foreground-rgb));
      }

      .chat-mention-card span {
        color: rgb(var(--dashboard-muted-foreground-rgb));
        font-size: 12px;
        line-height: 1.35;
      }

      .chat-mention-card small {
        color: var(--dashboard-link);
        font-size: 11px;
      }

      /* Shared loading indicator: inherits currentColor so it matches the
         muted text it sits next to in either theme. */
      .fm-spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 9999px;
        opacity: 0.75;
        vertical-align: -2px;
        margin-right: 8px;
        animation: fm-spin 0.7s linear infinite;
      }

      @keyframes fm-spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* The sign-in terminal's dialog box. Hand-written because the pre-built
         dashboard/tailwind.css carries no rule for the arbitrary utilities this
         dialog needs (`h-[min(680px,calc(100vh-3rem))]`, `bg-background/85`,
         `bg-[#0d0d10]`) — it is a checked-in artifact, not compiled per build.
         The height is the load-bearing one: without it the box sizes to its
         content, and the terminal below, which asks for as many rows as it is
         tall, grows the dialog with every line the node draws until it runs off
         the screen. A definite height makes the terminal scroll instead. */
      .fm-agent-login-modal {
        background: rgb(var(--dashboard-background-rgb) / 0.85);
      }

      .fm-agent-login-box {
        height: min(680px, calc(100vh - 3rem));
      }

      .fm-agent-login-surface {
        background: #0d0d10;
      }

      .fm-update-notice {
        flex: none;
      }

      .fm-update-notice[hidden] {
        display: none;
      }

      /* Streamed node terminal (agent-terminal.js). The grid is measured from
         this element's own metrics, so the font stack has to stay strictly
         monospaced or the remote program's column layout drifts. */
      .fm-agent-terminal {
        height: 100%;
        margin: 0;
        overflow-y: auto;
        white-space: pre;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
        font-size: 13px;
        line-height: 1.35;
        color: #c7c9cf;
        background: transparent;
        outline: none;
        tab-size: 8;
      }

      .fm-agent-terminal:focus-visible {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
      }

      /* Issue checklists are durable Markdown with a richer editing surface.
         The native input remains in the accessibility tree while the larger
         drawn box gives completion enough visual weight to feel actionable. */
      .issue-task-list {
        position: relative;
      }

      .issue-task-row {
        position: relative;
        border-radius: 0.55rem;
        transition: background-color 150ms ease, opacity 150ms ease,
          transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .issue-task-shell {
        position: relative;
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr) auto auto;
        align-items: start;
        min-height: 2.1rem;
        gap: 0.45rem;
        margin: 0 -0.35rem;
        padding: 0.2rem 0.35rem;
        border: 1px solid transparent;
        border-radius: 0.55rem;
        transition: border-color 150ms ease, background-color 150ms ease,
          box-shadow 150ms ease;
      }

      .issue-task-row:hover > .issue-task-shell,
      .issue-task-row:focus-within > .issue-task-shell {
        border-color: rgb(var(--dashboard-border-rgb) / 0.8);
        background: rgb(var(--dashboard-secondary-rgb) / 0.42);
        box-shadow: 0 5px 18px rgb(0 0 0 / 0.08);
      }

      .issue-task-control {
        position: relative;
        display: inline-grid;
        width: 1.65rem;
        height: 1.75rem;
        flex: 0 0 auto;
        place-items: center;
      }

      .issue-task-toggle {
        position: absolute;
        z-index: 2;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .issue-task-toggle:disabled {
        cursor: default;
      }

      .issue-task-box {
        position: relative;
        display: grid;
        width: 1.45rem;
        height: 1.45rem;
        overflow: hidden;
        place-items: center;
        border: 2px solid rgb(var(--dashboard-muted-foreground-rgb) / 0.72);
        border-radius: 0.45rem;
        background:
          linear-gradient(145deg, rgb(var(--dashboard-card-rgb)),
            rgb(var(--dashboard-secondary-rgb) / 0.72));
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.12),
          0 1px 2px rgb(0 0 0 / 0.16);
        color: white;
        transition: border-color 170ms ease, background 170ms ease,
          box-shadow 170ms ease, transform 170ms ease;
      }

      .issue-task-checkmark {
        width: 1rem;
        height: 1rem;
        opacity: 0;
        stroke-width: 3.4;
        transform: scale(0.2) rotate(-35deg);
        transition: opacity 150ms ease, transform 230ms
          cubic-bezier(0.2, 1.7, 0.45, 1);
      }

      .issue-task-toggle:focus-visible + .issue-task-box {
        outline: 3px solid rgb(var(--dashboard-ring-rgb) / 0.34);
        outline-offset: 2px;
      }

      .issue-task-toggle:checked + .issue-task-box {
        border-color: rgb(var(--dashboard-accent-rgb));
        background: rgb(var(--dashboard-accent-rgb));
        box-shadow: 0 0 0 3px rgb(var(--dashboard-accent-rgb) / 0.12),
          0 4px 12px rgb(var(--dashboard-accent-rgb) / 0.26);
      }

      .issue-task-toggle:checked + .issue-task-box .issue-task-checkmark {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }

      .issue-task-label {
        padding-top: 0.15rem;
        overflow-wrap: anywhere;
      }

      .issue-task-label-copy {
        border-radius: 0.2rem;
        transition: color 220ms ease, opacity 220ms ease,
          text-decoration-color 220ms ease;
      }

      .issue-task-row.is-complete > .issue-task-shell > .issue-task-label
        > .issue-task-label-copy {
        color: rgb(var(--dashboard-muted-foreground-rgb));
        opacity: 0.72;
        text-decoration: line-through;
        text-decoration-color: rgb(var(--dashboard-muted-foreground-rgb) / 0.7);
        text-decoration-thickness: 2px;
      }

      .issue-task-drag,
      .issue-task-convert,
      .issue-task-attached {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 1.65rem;
        border: 1px solid transparent;
        border-radius: 0.45rem;
        color: rgb(var(--dashboard-muted-foreground-rgb));
        font-size: 0.7rem;
        font-weight: 700;
        line-height: 1;
      }

      .issue-task-drag {
        width: 1.55rem;
        padding: 0;
        background: transparent;
        opacity: 0.22;
        cursor: grab;
        transition: color 120ms ease, opacity 120ms ease,
          background-color 120ms ease;
      }

      .issue-task-drag:active {
        cursor: grabbing;
      }

      .issue-task-row:hover .issue-task-drag,
      .issue-task-row:focus-within .issue-task-drag {
        opacity: 0.9;
      }

      .issue-task-drag:hover,
      .issue-task-drag:focus-visible {
        background: rgb(var(--dashboard-background-rgb) / 0.78);
        color: rgb(var(--dashboard-foreground-rgb));
        outline: none;
      }

      .issue-task-hover-actions {
        opacity: 0;
        pointer-events: none;
        transform: translateX(0.35rem) scale(0.94);
        transition: opacity 140ms ease, transform 180ms
          cubic-bezier(0.22, 1, 0.36, 1);
      }

      .issue-task-row:hover .issue-task-hover-actions,
      .issue-task-row:focus-within .issue-task-hover-actions {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(0) scale(1);
      }

      .issue-task-convert {
        gap: 0.3rem;
        padding: 0.25rem 0.5rem;
        border-color: rgb(var(--dashboard-border-rgb));
        background: rgb(var(--dashboard-background-rgb) / 0.9);
        cursor: pointer;
        white-space: nowrap;
      }

      .issue-task-convert:hover,
      .issue-task-convert:focus-visible {
        border-color: rgb(var(--dashboard-accent-rgb) / 0.75);
        background: rgb(var(--dashboard-accent-rgb) / 0.12);
        color: rgb(var(--dashboard-accent-rgb));
        outline: none;
      }

      .issue-task-attached {
        gap: 0.25rem;
        padding: 0.25rem 0.5rem;
        border-color: rgb(var(--dashboard-accent-rgb) / 0.35);
        background: rgb(var(--dashboard-accent-rgb) / 0.1);
        color: rgb(var(--dashboard-accent-rgb));
        text-decoration: none;
        white-space: nowrap;
      }

      .issue-task-attached:hover,
      .issue-task-attached:focus-visible {
        border-color: rgb(var(--dashboard-accent-rgb) / 0.75);
        background: rgb(var(--dashboard-accent-rgb) / 0.17);
        outline: none;
      }

      [data-repo-issue-task-list][aria-busy="true"] .issue-task-row {
        opacity: 0.68;
      }

      .issue-task-row.is-task-dragging {
        opacity: 0.34;
        transform: scale(0.985) rotate(-0.35deg);
      }

      .issue-task-row.is-task-drop-before > .issue-task-shell::before,
      .issue-task-row.is-task-drop-after > .issue-task-shell::after {
        position: absolute;
        z-index: 4;
        right: 0.3rem;
        left: 0.3rem;
        height: 3px;
        border-radius: 999px;
        background: linear-gradient(90deg,
          rgb(var(--dashboard-primary-rgb)),
          rgb(var(--dashboard-accent-rgb)));
        box-shadow: 0 0 12px rgb(var(--dashboard-accent-rgb) / 0.55);
        content: "";
      }

      .issue-task-row.is-task-drop-before > .issue-task-shell::before {
        top: -0.2rem;
      }

      .issue-task-row.is-task-drop-after > .issue-task-shell::after {
        bottom: -0.2rem;
      }

      .issue-task-row.is-task-settling {
        animation: fm-task-settle 420ms cubic-bezier(0.2, 1.5, 0.45, 1);
      }

      .issue-task-row.is-checking .issue-task-box {
        animation: fm-task-check-pop 680ms cubic-bezier(0.2, 1.5, 0.45, 1);
      }

      .issue-task-row.is-unchecking .issue-task-box {
        animation: fm-task-rewind 620ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .issue-task-row.is-checking .issue-task-label-copy {
        animation: fm-task-label-finish 620ms ease-out;
      }

      .issue-task-row.is-unchecking .issue-task-label-copy {
        animation: fm-task-label-reopen 560ms ease-out;
      }

      .issue-task-burst {
        position: absolute;
        z-index: 8;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        pointer-events: none;
      }

      .issue-task-burst > span {
        position: absolute;
        width: 0.3rem;
        height: 0.3rem;
        margin: -0.15rem;
        border-radius: 999px;
        background: hsl(var(--task-hue) 82% 58%);
        box-shadow: 0 0 7px currentColor;
        opacity: 0;
      }

      .issue-task-burst > span:nth-child(3n) {
        border-radius: 1px;
      }

      .issue-task-burst.is-bursting > span {
        animation: fm-task-constellation-out 760ms
          cubic-bezier(0.16, 0.84, 0.34, 1) forwards;
        animation-delay: var(--task-delay);
      }

      .issue-task-burst.is-rewinding > span {
        animation: fm-task-constellation-in 700ms
          cubic-bezier(0.22, 1, 0.36, 1) forwards;
        animation-delay: var(--task-delay);
      }

      @keyframes fm-task-check-pop {
        0% { transform: scale(0.78) rotate(-16deg); }
        32% { transform: scale(1.32) rotate(9deg); }
        56% { transform: scale(0.92) rotate(-4deg); }
        78% { transform: scale(1.08) rotate(2deg); }
        100% { transform: scale(1) rotate(0); }
      }

      @keyframes fm-task-rewind {
        0% { transform: scale(1) rotate(0); }
        36% { transform: scale(1.2) rotate(-18deg); }
        72% { transform: scale(0.86) rotate(8deg); }
        100% { transform: scale(1) rotate(0); }
      }

      @keyframes fm-task-label-finish {
        0%, 100% { background: transparent; transform: translateX(0); }
        36% { background: rgb(var(--dashboard-primary-rgb) / 0.18); transform: translateX(0.2rem); }
        66% { background: rgb(var(--dashboard-accent-rgb) / 0.1); transform: translateX(-0.06rem); }
      }

      @keyframes fm-task-label-reopen {
        0%, 100% { background: transparent; transform: translateX(0); }
        42% { background: rgb(var(--dashboard-accent-rgb) / 0.14); transform: translateX(-0.18rem); }
      }

      @keyframes fm-task-constellation-out {
        0% { opacity: 0; transform: rotate(var(--task-angle)) translateX(0) scale(0.2); }
        24% { opacity: 1; }
        68% { opacity: 0.95; transform: rotate(var(--task-angle)) translateX(1.9rem) scale(1); }
        100% { opacity: 0; transform: rotate(var(--task-angle)) translateX(2.5rem) scale(0); }
      }

      @keyframes fm-task-constellation-in {
        0% { opacity: 0; transform: rotate(var(--task-angle)) translateX(2.3rem) scale(0); }
        34% { opacity: 0.9; transform: rotate(var(--task-angle)) translateX(1.65rem) scale(0.9); }
        100% { opacity: 0; transform: rotate(var(--task-angle)) translateX(0) scale(0.2); }
      }

      @keyframes fm-task-settle {
        0% { transform: translateY(0.45rem) scale(0.985); opacity: 0.65; }
        58% { transform: translateY(-0.08rem) scale(1.005); opacity: 1; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }

      @media (hover: none) {

      [data-profile-contribution-radar],
      [data-profile-contribution-languages] {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }

      [data-profile-contribution-skyline] [tabindex="0"] {
        cursor: pointer;
        transition: filter 140ms ease, opacity 140ms ease;
      }

      [data-profile-contribution-skyline] [tabindex="0"]:hover {
        filter: brightness(1.12);
      }

      [data-profile-contribution-skyline] [tabindex="0"]:focus-visible {
        filter: brightness(1.18) drop-shadow(0 0 0.2rem rgb(var(--dashboard-ring-rgb)));
        outline: none;
      }

      [data-profile-contribution-tooltip] {
        position: absolute;
        z-index: 20;
        max-width: min(18rem, calc(100% - 1.5rem));
        pointer-events: none;
        border: 1px solid var(--contribution-tooltip-border);
        border-radius: 0.5rem;
        background: var(--contribution-tooltip-bg);
        box-shadow: 0 12px 32px rgb(0 0 0 / 0.28);
        color: var(--contribution-tooltip-fg);
        font-size: 0.75rem;
        line-height: 1.4;
        padding: 0.55rem 0.7rem;
      }

      [data-profile-contribution-loading],
      [data-profile-contribution-error] {
        position: absolute;
        inset: 1rem;
        z-index: 15;
        min-height: 0;
        border-radius: 0.75rem;
        background: rgb(var(--dashboard-background-rgb) / 0.94);
        backdrop-filter: blur(3px);
      }

      [data-profile-contribution-error] {
        display: grid;
        place-content: center;
      }

      [data-profile-contribution-metrics] {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        overflow: hidden;
      }

      [data-profile-contribution-metrics] > div {
        min-width: 0;
        padding: 0.75rem 0.9rem;
      }

      [data-profile-contribution-metrics] > div + div {
        border-left: 1px solid rgb(var(--dashboard-border-rgb));
      }

      [data-profile-contribution-coverage] {
        text-wrap: pretty;
      }

      @media (max-width: 1180px) {
        [data-profile-contribution-panorama] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        [data-profile-contribution-skyline-panel] {
          grid-column: 1 / -1;
          grid-row: auto;
        }

        [data-profile-contribution-insights] {
          display: contents;
        }
      }

      @media (max-width: 680px) {
        [data-profile-contribution-panorama] {
          grid-template-columns: minmax(0, 1fr);
        }

        [data-profile-contribution-skyline-panel],
        [data-profile-contribution-metrics] {
          grid-column: auto;
        }

        [data-profile-contribution-insights] {
          display: grid;
        }

        [data-profile-contribution-metrics] {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        [data-profile-contribution-metrics] > div {
          border-bottom: 1px solid rgb(var(--dashboard-border-rgb));
        }

        [data-profile-contribution-metrics] > div + div {
          border-left: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        html:focus-within {
          scroll-behavior: auto;
        }

        *,
        *::before,
        *::after,
        [data-profile-contribution-card] *,
        [data-profile-contribution-card] *::before,
        [data-profile-contribution-card] *::after,
        [data-repo-issue-task-list] *,
        [data-repo-issue-task-list] *::before,
        [data-repo-issue-task-list] *::after {
          scroll-behavior: auto !important;
          transition: none !important;
          animation: none !important;
        }
      }

      /* A single visible focus contract covers both authored Tailwind controls
         and controls produced by repository renderers and marketplace pages. */
      :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
        outline: 3px solid rgb(var(--dashboard-ring-rgb));
        outline-offset: 2px;
      }

      [data-dashboard-skip-link] {
        position: fixed;
        left: 0.75rem;
        top: 0.75rem;
        z-index: 100;
        transform: translateY(-200%);
        border-radius: 0.375rem;
        background: rgb(var(--dashboard-foreground-rgb));
        color: rgb(var(--dashboard-background-rgb));
        padding: 0.65rem 0.85rem;
        font-weight: 700;
      }

      [data-dashboard-skip-link]:focus {
        transform: translateY(0);
      }

      [data-command-palette]:not([hidden]) {
        display: flex;
      }

      [data-command-palette-result][aria-selected="true"] {
        background: rgb(var(--dashboard-secondary-rgb));
        color: rgb(var(--dashboard-foreground-rgb));
      }

      [data-repo-pull-diff-row] code,
      [data-repo-pull-diff-row] pre {
        font-variant-ligatures: none;
        tab-size: 4;
      }

      @media (pointer: coarse) {
        :where(button, [role="button"], [role="option"], input, select) {
          min-height: 44px;
        }

        /* Diff viewer on touch screens (issue #722). Every line number is a
           button, so the tap-target floor above stretched each diff row to
           44px: the diff read double-spaced and every file block's height
           estimate was off by half, which is what made the page jump while
           scrolling. The row keeps its own height; the whole gutter cell
           is the target. The thread marker sits absolutely inside it. */
        [data-repo-pull-diff-line],
        [data-repo-pull-inline-thread-toggle] {
          min-height: 0;
        }

        /* iOS zooms the page into any focused field under 16px and leaves it
           zoomed; the filter and the inline comment box are the two fields
           a reviewer uses. */
        [data-repo-pull-file-filter],
        [data-repo-pull-inline-body] {
          font-size: 16px;
        }
      }

      /* A phone reads the diff unified with slimmer gutters: 2.75rem still
         fits a five-digit line number, and the code column gets back 2rem of
         a ~24rem screen. Split is not offered there (effectivePullDiffMode). */
      @media (max-width: 767px) {
        [data-repo-pull-diff-mode-group] {
          display: none !important;
        }

        [data-repo-pull-diff-grid="unified"] {
          grid-template-columns: 2.75rem 2.75rem 1rem minmax(0, 1fr);
        }

        [data-repo-pull-diff-grid="hunk"] {
          grid-template-columns: 6.5rem minmax(0, 1fr);
        }

        [data-repo-pull-diff-gutter] {
          padding-left: 0.25rem;
          padding-right: 0.25rem;
        }

        [data-repo-pull-diff-blocks] {
          padding: 0.5rem;
          gap: 0.5rem;
        }
      }

      @media (forced-colors: active) {
        :where(a, button, input, select, textarea, summary, [tabindex]):focus-visible {
          outline-color: Highlight;
        }

        [data-repo-pull-diff-row] {
          border-left: 2px solid CanvasText;
        }
      }

      @media (max-width: 1023px) {
        [data-dashboard-root] {
          height: 100dvh;
        }

        [data-home-content-column] {
          order: -1;
        }

        [data-app-header] {
          height: 3.75rem;
          gap: 0.75rem;
          padding-left: 0.75rem;
          padding-right: 0.75rem;
        }

        [data-top-nav] {
          display: none;
        }

        [data-mobile-menu-toggle] {
          display: inline-flex;
        }

        [data-dashboard-sidebar] {
          top: calc(3.75rem + 6px);
          max-height: calc(100dvh - 3.75rem - 18px);
        }

        [data-repo-toolbar] {
          align-items: stretch;
          flex-direction: column;
        }

        [data-repo-view-toggle] {
          align-self: flex-end;
        }

        .repo-list.grid-mode {
          grid-template-columns: minmax(0, 1fr);
          padding: 0.5rem;
        }

      }

      /* The header box now ships its own ✕ ([data-global-search-clear]), which
         is styled with the rest of the chrome and works in every browser. Hide
         WebKit's native type="search" one rather than showing two. */
      [data-global-search]::-webkit-search-cancel-button {
        display: none;
      }

      ::selection {
        background: rgb(88 166 255 / 0.28);
      }

      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background: rgb(var(--dashboard-scrollbar-rgb) / 0.18);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgb(var(--dashboard-scrollbar-rgb) / 0.28);
        background-clip: padding-box;
      }
    </style>
    <script src="/dashboard-plugin-host.js?v=${version}"></script><!--#page pluginscript-->
    <script src="/user-status.js?v=${version}" defer></script>
    <script src="/dashboard.js?v=${version}" defer></script>
    <script src="/dashboard-composer.js?v=${version}" defer></script>
    <script src="/membership-prompt.js?v=${version}" defer></script>
<!--#page chatscript-->
<!--#page geniescript-->
  </head>
  <body class="bg-background text-foreground" data-page="<!--#page id-->">
    <a data-dashboard-skip-link href="#dashboardMain">Skip to main content</a>
    <div data-dashboard-root data-dashboard-section="<!--#page section-->" class="flex h-screen flex-col overflow-hidden bg-background text-foreground font-sans">
<!--#include partial="header"-->

      <button data-mobile-sidebar-backdrop type="button" aria-label="Close dashboard menu"></button>

      <div data-dashboard-shell class="flex flex-1 min-h-0 overflow-hidden">
<!--#include partial="sidebar"-->

<!--#include partial="main"-->
	    </div>

	    </div>

<!--#include partial="modals"-->
<!--#page extras-->

	    <script>
      const avatarColors = ["#4ade80", "#818cf8", "#38bdf8", "#fb923c", "#f472b6", "#fbbf24"];

	      function setProfilePopoverOpen(open) {
	        const toggle = document.querySelector("[data-profile-toggle]");
	        const popover = document.querySelector("[data-profile-popover]");
	        if (!toggle || !popover) return;

	        popover.classList.toggle("hidden", !open);
	        toggle.setAttribute("aria-expanded", open ? "true" : "false");
		      }

	      function handleLogout() {
	        try {
	          fetch("/api/accounts/logout", { method: "POST", keepalive: true }).catch(() => {});
	          localStorage.removeItem("forkmesh.session");
	        } catch (_) {}

	        document.cookie = "forkmesh_session=; Path=/; Max-Age=0; SameSite=Lax";
	        setProfilePopoverOpen(false);
	        window.location.href = window.location.protocol === "file:" ? "index.html" : "/";
	      }

	      function initProfileMenu() {
	        const toggle = document.querySelector("[data-profile-toggle]");
	        const popover = document.querySelector("[data-profile-popover]");
	        const logout = document.querySelector("[data-logout-button]");
	        if (!toggle || !popover || !logout) return;

	        toggle.addEventListener("click", (event) => {
	          event.stopPropagation();
	          setProfilePopoverOpen(popover.classList.contains("hidden"));
	        });

	        popover.addEventListener("click", (event) => {
	          event.stopPropagation();
	        });

	        logout.addEventListener("click", handleLogout);
	        document.addEventListener("click", () => setProfilePopoverOpen(false));
	        document.addEventListener("keydown", (event) => {
	          if (event.key === "Escape") setProfilePopoverOpen(false);
	        });
	      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") setProfilePopoverOpen(false);
      });

      const repoPageSize = 5;
      let repoCurrentPage = 1;
      let repoIsFetching = false;
      let repoFetchTimer;

      function repoCards() {
        return [...document.querySelectorAll(".repo-card")];
      }

      function repoQuery() {
        // The search box only exists on the repos page document.
        return document.getElementById("repoSearch")?.value.trim().toLowerCase() || "";
      }

      function filteredRepoCards() {
        const query = repoQuery();
        return repoCards().filter((card) => !query || card.dataset.repo.includes(query));
      }

      function setRepoButtonDisabled(button, disabled) {
        if (!button) return;
        button.disabled = disabled;
        button.classList.toggle("opacity-40", disabled);
        button.classList.toggle("pointer-events-none", disabled);
      }

      function renderRepoPageButtons(totalPages) {
        const pages = document.querySelector("[data-repo-pages]");
        if (!pages) return;
        pages.innerHTML = "";

        for (let page = 1; page <= totalPages; page += 1) {
          const button = document.createElement("button");
          const active = page === repoCurrentPage;
          button.type = "button";
          button.setAttribute("data-repo-page-button", String(page));
          button.textContent = String(page);
          button.setAttribute("aria-label", `Show repository page ${page}`);
          button.setAttribute("aria-current", active ? "page" : "false");
          button.className = [
            "h-8 min-w-8 rounded-md border px-2 text-xs font-mono transition-colors",
            active
              ? "border-border bg-secondary text-foreground"
              : "border-transparent text-muted-foreground hover:border-border hover:bg-secondary hover:text-foreground",
          ].join(" ");
          button.disabled = repoIsFetching;
          button.addEventListener("click", () => setRepoPage(page));
          pages.appendChild(button);
        }
      }

      function applyRepoVisibility() {
        // Repo cards + pagination only exist on the repos page document.
        const list = document.getElementById("repoList");
        if (!list) return;
        const cards = repoCards();
        const matchedCards = filteredRepoCards();
        const totalPages = Math.max(1, Math.ceil(matchedCards.length / repoPageSize));
        repoCurrentPage = Math.min(repoCurrentPage, totalPages);

        const start = (repoCurrentPage - 1) * repoPageSize;
        const end = Math.min(start + repoPageSize, matchedCards.length);
        const visibleCards = new Set(matchedCards.slice(start, end));

        cards.forEach((card) => {
          card.classList.toggle("is-hidden", !visibleCards.has(card));
        });

        list.classList.toggle("is-fetching", repoIsFetching);
        document.querySelector("[data-repo-loading]")?.classList.toggle("hidden", !repoIsFetching);

        const summary = document.querySelector("[data-repo-summary]");
        if (summary) {
          summary.textContent = matchedCards.length
            ? `Showing ${start + 1}-${end} of ${matchedCards.length} mirrored repositories`
            : "0 mirrored repositories";
        }

        renderRepoPageButtons(totalPages);
        setRepoButtonDisabled(document.querySelector("[data-repo-prev]"), repoIsFetching || repoCurrentPage === 1);
        setRepoButtonDisabled(document.querySelector("[data-repo-next]"), repoIsFetching || repoCurrentPage === totalPages);
      }

      function setRepoPage(page, options = {}) {
        const totalPages = Math.max(1, Math.ceil(filteredRepoCards().length / repoPageSize));
        const targetPage = Math.min(Math.max(page, 1), totalPages);
        if (targetPage === repoCurrentPage && !options.force) return;

        window.clearTimeout(repoFetchTimer);
        if (options.instant) {
          repoCurrentPage = targetPage;
          repoIsFetching = false;
          applyRepoVisibility();
          return;
        }

        repoIsFetching = true;
        applyRepoVisibility();
        repoFetchTimer = window.setTimeout(() => {
          repoCurrentPage = targetPage;
          repoIsFetching = false;
          applyRepoVisibility();
        }, 220);
      }

      document.getElementById("repoSearch")?.addEventListener("input", () => {
        window.clearTimeout(repoFetchTimer);
        repoCurrentPage = 1;
        repoIsFetching = false;
        applyRepoVisibility();
      });

      document.querySelector("[data-repo-prev]")?.addEventListener("click", () => setRepoPage(repoCurrentPage - 1));
      document.querySelector("[data-repo-next]")?.addEventListener("click", () => setRepoPage(repoCurrentPage + 1));
      applyRepoVisibility();

      document.querySelectorAll("[data-view-mode]").forEach((button) => {
        button.addEventListener("click", () => {
          const mode = button.dataset.viewMode;
          const gridMode = mode === "grid";
          document.getElementById("repoList").classList.toggle("grid-mode", gridMode);
          document.querySelectorAll("[data-view-mode]").forEach((control) => {
            const active = control.dataset.viewMode === mode;
            control.setAttribute("aria-pressed", active ? "true" : "false");
            control.classList.toggle("bg-secondary", active);
            control.classList.toggle("text-foreground", active);
            control.classList.toggle("text-muted-foreground", !active);
          });
        });
      });

      document.querySelectorAll(".copy-button").forEach((button) => {
        button.addEventListener("click", async () => {
          const text = button.dataset.copy;
          try {
            await navigator.clipboard.writeText(text);
          } catch (error) {
            const temp = document.createElement("textarea");
            temp.value = text;
            temp.setAttribute("readonly", "");
            temp.style.position = "fixed";
            temp.style.opacity = "0";
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            temp.remove();
          }
          button.classList.add("copied");
          window.setTimeout(() => button.classList.remove("copied"), 1600);
        });
      });

      // Chat is wired by /dashboard-chat.js.
	      initProfileMenu();
	      // The lucide CDN script is deferred, so it has not executed yet while
	      // this inline script parses; dashboard.js re-runs createIcons once
	      // lucide exists. A bare call here throws on every page load.
	      window.lucide?.createIcons();
    </script>
  </body>
