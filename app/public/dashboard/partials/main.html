      <main id="dashboardMain" data-dashboard-main tabindex="-1" class="flex-1 min-w-0 flex flex-col overflow-hidden">
        <div data-update-notice hidden class="fm-update-notice" role="status" aria-live="polite">
          <div class="flex items-center gap-3 border-b border-border bg-card px-4 py-2">
            <i data-lucide="sparkles" class="h-4 w-4 shrink-0 text-accent"></i>
            <div class="min-w-0 flex-1">
              <p class="text-sm font-semibold text-foreground">A new version of ForkMesh is available</p>
              <p data-update-notice-detail class="text-xs leading-5 text-muted-foreground">Update reloads this page on the new version.</p>
            </div>
            <button data-update-notice-apply type="button" class="inline-flex h-8 shrink-0 items-center justify-center rounded-md bg-primary px-3 text-sm font-semibold text-primary-foreground hover:bg-primary/90 disabled:opacity-60">Update</button>
            <button data-update-notice-dismiss type="button" aria-label="Dismiss update notice" class="shrink-0 rounded-md p-1.5 text-muted-foreground hover:bg-secondary hover:text-foreground transition-colors">
              <i data-lucide="x" class="h-4 w-4"></i>
            </button>
          </div>
        </div>
        <div id="content" class="flex-1 min-h-0 overflow-hidden">
<!--#include view-->
                <template data-profile-sidebar-template>
                  <div class="flex items-start gap-4 lg:block">
                    <span data-profile-page-avatar class="relative flex h-72 w-72 max-h-28 max-w-28 shrink-0 items-center justify-center overflow-hidden rounded-full border border-border bg-secondary text-4xl font-semibold text-foreground font-mono sm:max-h-36 sm:max-w-36 lg:max-h-none lg:max-w-none">
                      <img data-profile-page-avatar-image class="hidden h-full w-full object-cover" alt="" />
                      <span data-avatar-initial>F</span>
                    </span>
                    <div class="min-w-0 pt-1 lg:pt-4">
                      <div class="flex flex-wrap items-center gap-2">
                        <h1 data-profile-page-node-name class="truncate text-2xl font-semibold leading-tight text-foreground">My Profile</h1>
                        <span data-profile-kind-badge class="hidden shrink-0 inline-flex items-center gap-1 rounded-full border border-border bg-secondary px-2 py-0.5 text-xs font-semibold text-muted-foreground">
                          <i data-lucide="server" class="h-3 w-3"></i>
                          Node
                        </span>
                      </div>
                      <p data-profile-page-email class="truncate text-xl font-normal leading-6 text-muted-foreground">Sign in to view email</p>
                    </div>
                  </div>
                  <p data-profile-bio class="mt-4 text-base leading-6 text-foreground">No bio yet.</p>
                  <div class="mt-4 grid gap-2">
                    <a href="/dashboard/settings" class="flex w-full items-center justify-center rounded-md border border-border bg-secondary px-3 py-1.5 text-sm font-semibold text-foreground hover:bg-background">Edit profile</a>
                  </div>
                  <div data-profile-followers class="mt-4 flex items-center gap-1 text-sm text-muted-foreground">
                    <i data-lucide="users" class="h-4 w-4"></i>
                    <span data-profile-followers-count class="font-semibold text-foreground">0</span> followers · <span data-profile-following class="inline-flex items-center gap-1"><span data-profile-following-count class="font-semibold text-foreground">0</span> following</span> · <span data-profile-mirrors class="inline-flex items-center gap-1"><span data-profile-mirrors-count class="font-semibold text-foreground">0</span> mirrors</span>
                  </div>
                  <ul class="mt-4 grid gap-2 text-sm text-foreground">
                    <li data-profile-node-status class="hidden flex items-center gap-2">
                      <i data-lucide="circle" class="h-4 w-4 text-muted-foreground"></i>
                      <span data-profile-node-status-text>Offline</span>
                    </li>
                    <li data-profile-location class="flex items-center gap-2">
                      <i data-lucide="map-pin" class="h-4 w-4 text-muted-foreground"></i>
                      <span data-profile-location-text>No location</span>
                    </li>
                    <li data-profile-email-row hidden class="flex items-center gap-2">
                      <i data-lucide="mail" class="h-4 w-4 text-muted-foreground"></i>
                      <a data-profile-email-text href="#" class="min-w-0 truncate text-foreground hover:text-accent hover:underline"></a>
                    </li>
                    <li data-profile-timezone class="flex items-center gap-2">
                      <i data-lucide="clock-3" class="h-4 w-4 text-muted-foreground"></i>
                      <span data-profile-local-time>18:21 (UTC +05:30)</span>
                    </li>
                    <li data-profile-membership class="flex items-center gap-2">
                      <i data-lucide="calendar-days" class="h-4 w-4 text-muted-foreground"></i>
                      <span data-profile-member-for>Member since join date unavailable</span>
                    </li>
                    <li class="flex items-center gap-2">
                      <i data-lucide="link" class="h-4 w-4 text-muted-foreground"></i>
                      <a data-profile-website href="https://forkmesh.com" class="min-w-0 truncate text-foreground hover:text-accent hover:underline">https://forkmesh.com</a>
                    </li>
                  </ul>
                  <section data-profile-badges hidden class="mt-4 overflow-hidden rounded-md border border-border bg-card">
                    <div class="flex items-center gap-2 border-b border-border px-3 py-2">
                      <i data-lucide="award" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                      <h2 class="min-w-0 flex-1 truncate text-sm font-semibold text-foreground">Badges</h2>
                      <span data-profile-badges-count class="rounded-full bg-secondary px-2 py-0.5 text-[11px] font-semibold text-muted-foreground">0</span>
                    </div>
                    <ul data-profile-badges-list class="grid gap-3 p-3 text-sm"></ul>
                  </section>
                  <section data-profile-tips class="mt-4 overflow-hidden rounded-md border border-border bg-card">
                    <div class="flex items-center gap-2 border-b border-border px-3 py-2">
                      <i data-lucide="coins" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                      <h2 class="min-w-0 flex-1 truncate text-sm font-semibold text-foreground">Tips</h2>
                    </div>
                    <div class="grid gap-3 p-3">
                      <p data-profile-tips-empty class="text-xs leading-5 text-muted-foreground">This user has not entered a Solana address for tips.</p>
                      <div data-profile-tips-detail hidden class="grid justify-items-center gap-3">
                        <div data-profile-tips-qr class="grid min-h-[60px] min-w-[60px] place-items-center rounded-md border border-border bg-background p-1 text-center text-[11px] text-muted-foreground"></div>
                        <code data-profile-tips-address class="w-full break-all rounded-md border border-border bg-background px-2 py-1.5 text-center font-mono text-[11px] leading-4 text-foreground"></code>
                        <button data-profile-tips-copy type="button" class="w-full rounded-md border border-border bg-secondary px-3 py-1.5 text-xs font-semibold text-foreground hover:bg-background">Copy address</button>
                      </div>
                    </div>
                  </section>
                  <section data-profile-fediverse hidden class="mt-4 overflow-hidden rounded-md border border-border bg-card">
                    <div class="flex items-center gap-2 border-b border-border px-3 py-2">
                      <i data-lucide="globe" class="h-4 w-4 shrink-0 text-muted-foreground"></i>
                      <h2 class="min-w-0 flex-1 truncate text-sm font-semibold text-foreground">Fediverse</h2>
                      <a data-profile-fediverse-link href="#" target="_blank" rel="noopener noreferrer" class="min-w-0 truncate text-xs text-muted-foreground hover:text-accent hover:underline"></a>
                      <button data-profile-fediverse-popout type="button" title="Open this feed in a new window" aria-label="Open this feed in a new window" class="inline-flex h-5 w-5 shrink-0 items-center justify-center rounded border border-border text-muted-foreground hover:bg-secondary hover:text-foreground">
                        <i data-lucide="external-link" class="h-3 w-3"></i>
                      </button>
                    </div>
                    <div data-profile-fediverse-posts class="grid text-sm"></div>
                  </section>
                </template>
        </div>
        <!-- ForkMesh Ads "web" slot. Composed documents are edge-cached and
             identical for every viewer, so the slot ships empty and hidden:
             dashboard.js (js/09-ads.js, initAdSlot) fills it after the page is
             idle from an anonymous, credential-free request, and leaves it
             collapsed when there is no ad. It reserves no layout space. -->
        <aside data-forkmesh-ad-slot="web" hidden aria-label="Sponsored" class="shrink-0 border-t border-border bg-card px-4 py-2"></aside>
      </main>
