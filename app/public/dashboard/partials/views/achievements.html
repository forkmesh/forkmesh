          <section data-view="achievements" class="view active h-full overflow-y-auto">
            <div class="p-3 sm:p-6 w-full">
              <div data-achievements-panel class="w-full rounded-lg border border-border bg-card overflow-hidden">
                <div class="px-4 sm:px-5 py-4 border-b border-border flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                  <div class="min-w-0">
                    <h1 class="text-base font-semibold text-foreground">Achievements</h1>
                    <p class="mt-1 text-sm text-muted-foreground">Every badge you can earn on <span data-platform-name>ForkMesh</span>. Earned badges show their level and the next one; locked badges show what earns them and how close you are.</p>
                  </div>
                  <div class="shrink-0 flex items-center gap-3 self-start">
                    <span data-achievements-count class="fm-label">Loading</span>
                  </div>
                </div>

                <div data-achievements-notice aria-live="polite"></div>

                <div data-achievements-earned-section class="px-4 sm:px-5 py-4 border-b border-border" hidden>
                  <h2 class="text-xs font-semibold uppercase tracking-wide text-muted-foreground">Earned</h2>
                  <ul data-achievements-earned class="mt-3 grid gap-5 sm:grid-cols-2 lg:grid-cols-3"></ul>
                </div>

                <div class="px-4 sm:px-5 py-4">
                  <h2 class="text-xs font-semibold uppercase tracking-wide text-muted-foreground">Locked</h2>
                  <ul data-achievements-locked class="mt-3 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
                    <li class="text-sm text-muted-foreground"><span class="fm-spinner" aria-hidden="true"></span>Loading badges...</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>
