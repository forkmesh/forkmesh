          <section data-view="hackathon" class="view active h-full overflow-y-auto">
            <div class="p-3 sm:p-6 w-full">
              <div data-hackathon-panel class="w-full rounded-lg border border-border bg-card overflow-hidden">
                <div class="px-4 sm:px-5 py-4 border-b border-border flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
                  <div class="min-w-0">
                    <h1 data-hackathon-title class="text-base font-semibold text-foreground">Hackathon</h1>

              </div>
            </div>
