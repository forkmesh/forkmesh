# Instant notification email. enqueue_notification rings a payload-free
# doorbell here and the consumer sends the mail, so a comment POST never waits
# on a Mailtrap round-trip. deploy.sh creates the queue before deploying, since
# wrangler refuses a deploy that names a queue the account does not have.
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "forkmesh-notification-email"

# max_batch_timeout is the latency floor for "instant", so it is the smallest
# value that still collapses a thread's fan-out into one invocation. The batch
# size is what one consumer run will serve at most; NOTIFICATION_QUEUE_MAX_
# RECIPIENTS bounds the distinct accounts inside it, and the per-minute cron
# backstop picks up any overflow.
[[queues.consumers]]
queue = "forkmesh-notification-email"
max_batch_size = 10
max_batch_timeout = 1
max_retries = 3
max_concurrency = 1

[[env.dev.d1_databases]]
binding = "DB"
database_name = "forkmesh-dev"
database_id = "REPLACE_WITH_DEV_D1_DATABASE_ID"
migrations_dir = "migrations"

