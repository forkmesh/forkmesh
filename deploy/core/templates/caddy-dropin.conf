# Managed by deploy/core/render.py for node @@NODE@@. Drop-in for the
# caddy.service of Debian's caddy package; the binary it runs is set by
# forkmesh-next-binary.conf (tools/next_fleet.py step caddy).
[Unit]
After=forkmesh-app.service wg-quick@wg0.service

[Service]
Environment=TZ=UTC
Environment=GOMEMLIMIT=90MiB
# The tls-*.caddy / acme-http.caddy includes must exist before Caddy parses
# its config: write them from the local certificates (no network, as root;
# "+" runs it outside the sandbox below).
ExecStartPre=+/usr/bin/python3 -I @@OPT@@/bin/fmnext-certsync prepare --config @@ETC@@/certsync.json
Restart=on-failure
RestartSec=2s
MemoryMax=160M
# TLS private keys never reach the swapfile or zram.
MemorySwapMax=0
OOMScoreAdjust=-300
LimitNOFILE=65536
# The admin API is the unix socket /run/caddy/admin.sock (Caddyfile), in a
# directory only caddy (and root) can enter. ExecReload's `caddy reload`
# finds it in the Caddyfile.
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
# Sandbox (Caddy is the internet-facing process). Empty assignments first:
# these settings add up across the unit and its drop-ins.
AmbientCapabilities=
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=true
ProtectSystem=strict
# ACME account/certificates and autosave.json live under caddy's HOME.
ReadWritePaths=/var/lib/caddy
# The private Git mirror (tools/next_git_host.py, root:caddy 0750/0640) is
# read-only here; "-": no error on a node where it does not exist yet.
ReadOnlyPaths=-/var/lib/forkmesh-next/git
ProtectHome=true
PrivateTmp=true
PrivateDevices=true
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
RestrictAddressFamilies=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
IPAddressDeny=169.254.0.0/16
