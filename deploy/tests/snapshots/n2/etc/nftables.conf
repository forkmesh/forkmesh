#!/usr/sbin/nft -f
# Managed by deploy/core/render.py for node n2. Do not edit on the node.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } limit rate 20/second accept
		meta l4proto ipv6-icmp accept
		tcp dport { 822, 80, 443 } accept
		udp dport { 443, 51820 } accept
		iifname "wg0" ip saddr { 10.77.0.1, 10.77.0.2, 10.77.0.3 } tcp dport { 80, 4001, 4002, 8792, 8793 } accept
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
		# Raft (plaintext, no password): the rqlite user only.
		ip daddr { 10.77.0.0/24, 127.0.0.0/8 } tcp dport 4002 meta skuid != "rqlite" counter reject with tcp reset
		# rqlite HTTP: the app, and root (rqlite.curlrc, the backup and
		# migration SSH tunnels, fmnext-app-ops).
		ip daddr { 10.77.0.0/24, 127.0.0.0/8 } tcp dport 4001 meta skuid != { "root", "forkmesh-app" } counter reject with tcp reset
		# Mesh (Durable Objects, peer unseal): the app only.
		ip daddr { 10.77.0.0/24, 127.0.0.0/8 } tcp dport 8792 meta skuid != "forkmesh-app" counter reject with tcp reset
		# certsync pair server: root's fmnext-cert-sync round only.
		ip daddr { 10.77.0.0/24, 127.0.0.0/8 } tcp dport 8793 meta skuid != "root" counter reject with tcp reset
		# Cloud metadata: nobody but root (cloud-init).
		ip daddr 169.254.0.0/16 meta skuid != "root" counter reject
		# IDS (docs/IDS.md): log unusual outbound connections of the
		# service users (log only; rate-limited).
		meta skuid { "forkmesh-app", "caddy", "rqlite", "fmnext-certsync" } ct state new ip daddr != { 127.0.0.0/8, 10.77.0.0/24 } tcp flags & (syn | ack) == syn tcp dport != { 80, 443 } limit rate 6/minute log prefix "fmnext-ids-egress: " flags skuid
		meta skuid { "forkmesh-app", "caddy", "rqlite", "fmnext-certsync" } ct state new ip daddr != { 127.0.0.0/8, 10.77.0.0/24 } udp dport != { 53, 123, 443 } limit rate 6/minute log prefix "fmnext-ids-egress: " flags skuid
		meta skuid { "forkmesh-app", "caddy", "rqlite", "fmnext-certsync" } ct state new ip6 daddr != { ::1, fe80::/10 } tcp flags & (syn | ack) == syn tcp dport != { 80, 443 } limit rate 6/minute log prefix "fmnext-ids-egress: " flags skuid
		meta skuid { "forkmesh-app", "caddy", "rqlite", "fmnext-certsync" } ct state new ip6 daddr != { ::1, fe80::/10 } udp dport != { 53, 123, 443 } limit rate 6/minute log prefix "fmnext-ids-egress: " flags skuid
	}
}
