    <script src="/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found - ForkMesh</title>
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <script>
      (() => {
        const parts = location.pathname.split("/").filter(Boolean);
        if (parts.length !== 1) return;
        const name = decodeURIComponent(parts[0]).toLowerCase();
        if (!/^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$/.test(name)) return;
        const origin = location.hostname.toLowerCase() === "forkmesh.com"
          ? "https://forkmesh.com"
          : location.origin;
        location.replace(origin + "/@" + encodeURIComponent(name) + location.search);
      })();
    </script>
    <meta
      name="description"
      content="The ForkMesh page you requested could not be found. Return home, read the docs, or sign in to continue."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="stylesheet" href="/tailwind.css" />

            colors: {
              background: "var(--background)",
              foreground: "var(--foreground)",
              border: "var(--border)",
              "muted-foreground": "var(--muted-foreground)",
              primary: "var(--primary)",
              "primary-foreground": "var(--primary-foreground)",

            fontFamily: {

                "ABCFavoritMono",

    </script>

      .button-ghost {
