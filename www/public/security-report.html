<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script src="/api-client.js?v=${version}"></script>
    <script src="/analytics.js"></script>
    <script src="/safe-input.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report a vulnerability · ForkMesh</title>
    <meta name="description" content="Privately report a security vulnerability to the ForkMesh team." />
    <meta name="application-name" content="ForkMesh" />
    <meta name="apple-mobile-web-app-title" content="ForkMesh" />
    <meta name="theme-color" content="#090909" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/security-report.js?v=${version}" defer></script>
    <style>
      body {
        min-height: 100vh;
        color: #f5f5f5;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.16), transparent 30rem),
          #050505;
      }
      .auth-shell {
        min-height: calc(100vh - 3.5rem);
        display: grid;
        place-items: start center;
        padding: 40px 16px 60px;
      }
      .auth-card {
        width: min(100%, 520px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 18px;
        background: rgba(8, 8, 8, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
        padding: 28px 26px;
      }
      .brand { width: fit-content; margin: 0 auto 24px; }
      .auth-card h1 {
        font-size: 22px; font-weight: 800; line-height: 1.1; margin: 0 0 6px; color: #ffffff;
      }
      .auth-sub {
        color: rgba(255, 255, 255, 0.58); margin: 0 0 22px; font-size: 13px; line-height: 1.5;
      }
      .auth-sub a { color: rgba(255,255,255,.82); }
      .field { margin: 0 0 14px; }
      .field label {
        display: block; font-weight: 650; font-size: 12px; margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.82);
      }
      .field input, .field select, .field textarea {
        width: 100%; padding: 0.5rem 0.7rem; border-radius: 0.75rem;
        border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.055);
        color: #f5f5f5; font: inherit; font-size: 13px; box-sizing: border-box;
      }
      .field input { height: 2.25rem; }
      .field select { height: 2.25rem; appearance: none; cursor: pointer; }
      .field textarea { resize: vertical; min-height: 130px; line-height: 1.5; }
      .field input:focus, .field select:focus, .field textarea:focus {
        outline: 0; border-color: rgba(255, 255, 255, 0.34);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.12);
      }
      .auth-button-primary {
        display: inline-flex; align-items: center; justify-content: center;
        width: 100%; height: 2.4rem; border-radius: 0.75rem; border: 0;
        background: #f5f5f5; color: #050505; font-size: 13px; font-weight: 750;
        cursor: pointer; transition: transform 150ms ease, background-color 150ms ease;
      }
      .auth-button-primary:hover { background: #d9d9d9; }
      .auth-button-primary:active { transform: translateY(1px); }
      .auth-button-primary:disabled { background: #555; color: #999; cursor: not-allowed; }
      #sr-btn:not(:disabled) {
        border: 1px solid #f4f4f5;
        background: linear-gradient(180deg, #ffffff 0%, #e8e8ea 100%);
        box-shadow: inset 0 -1px 0 rgba(0, 0, 0, 0.14), 0 1px 2px rgba(0, 0, 0, 0.5);
        color: #111113;
      }
      #sr-btn:not(:disabled):hover { background: linear-gradient(180deg, #ffffff 0%, #f1f1f2 100%); }
      html.light #sr-btn:not(:disabled) {
        border-color: #161616;
        background: linear-gradient(180deg, #2c2c2c 0%, #222222 100%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.17), 0 1px 2px rgba(0, 0, 0, 0.16);
        color: #ffffff;
      }
      html.light #sr-btn:not(:disabled):hover { background: linear-gradient(180deg, #363636 0%, #2a2a2a 100%); }
      #sr-btn:focus-visible { outline: 2px solid #58a6ff; outline-offset: 2px; }
      html.light #sr-btn:focus-visible { outline-color: #0969da; }
      .hint {
        font-size: 12px; color: rgba(255, 255, 255, 0.62);
        margin: 8px 0 0; min-height: 18px; line-height: 1.5;
      }
      .hint.bad  { color: #f85149; }
      .hint.good { color: #3fb950; }
      .private-badge {
        display: inline-flex; align-items: center; gap: 5px; font-size: 11px;
        font-weight: 650; color: rgba(255,255,255,.54);
        border: 1px solid rgba(255,255,255,.12); border-radius: 99px;
        padding: 2px 9px; margin-bottom: 18px;
      }
      .row-links {
        text-align: center; margin-top: 18px;
        color: rgba(255, 255, 255, 0.5); font-size: 12px;
      }
      .row-links a { color: rgba(255,255,255,.78); }
    </style>
    <link rel="stylesheet" href="/auth-page-theme.css" />
    <link rel="stylesheet" href="/site-header.css" />
    <script src="/site-header.js?v=${version}" defer></script>
    <script src="/genie-spider.js?v=${version}" defer></script>
  </head>
  <body>
    <div data-forkmesh-header="simple"></div>
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="report-title">
        <a class="brand" href="/" aria-label="ForkMesh home">
          <img class="brand-mark" src="/assets/logo.svg" alt="" aria-hidden="true" />
        </a>

        <h1 id="report-title">Report a vulnerability</h1>
        <p class="auth-sub">
          Your report is stored encrypted and sent directly to the security team
          &mdash; it is never published or visible in the public issue tracker.
          See our <a href="https://app.forkmesh.com/forkmesh/forkmesh/tree/main/SECURITY.md">security policy</a> for scope and response times.
        </p>

        <span class="private-badge" aria-label="Private report">
          <svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M8 1a3.5 3.5 0 0 0-3.5 3.5V6H3a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1h-1.5V4.5A3.5 3.5 0 0 0 8 1Zm-2 3.5a2 2 0 1 1 4 0V6H6V4.5Z" fill="currentColor"/>
          </svg>
          Encrypted &amp; private
        </span>

        <div class="field">
          <label for="sr-component">Component</label>
          <select id="sr-component">
            <option value="identity">Identity &amp; signing</option>
            <option value="relay">Relay / App</option>
            <option value="mirroring">Mirroring</option>
            <option value="chat">Encrypted chat</option>
            <option value="donations">Donations / Solana</option>
            <option value="website">Website / dashboard</option>
            <option value="client">Desktop client</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="field">
          <label for="sr-title">Title</label>
          <input id="sr-title" type="text" maxlength="200"
            placeholder="Short description, e.g. &quot;RCE via crafted git pack&quot;" />
        </div>

        <div class="field">
          <label for="sr-body">Description</label>
          <textarea id="sr-body" maxlength="16384"
            placeholder="Describe the vulnerability: what it is, how to reproduce it, and its potential impact. A proof-of-concept or reproduction steps are very helpful."></textarea>
        </div>

        <div class="field">
          <label for="sr-contact">Contact (optional)</label>
          <input id="sr-contact" type="text" maxlength="254"
            placeholder="Email or handle for follow-up &mdash; leave blank to report anonymously" />
        </div>

        <div class="hint" id="sr-hint" role="status"></div>

        <button class="auth-button-primary" id="sr-btn">Submit report</button>

        <p class="row-links">
          Or email us directly at
          <a href="mailto:security@forkmesh.com">security@forkmesh.com</a>
        </p>
      </section>
    </main>
  </body>
</html>
